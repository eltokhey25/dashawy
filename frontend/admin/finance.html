  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>المالية — دشاوي</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/admin/_admin.css" />
  </head>
  <body class="adm-body">
    <div class="adm-shell">
      <aside class="adm-sidebar" id="sidebar">
        <div class="adm-sidebar-brand">
          <span class="asb-logo"><i class="fa-solid fa-satellite-dish"></i></span>
          <div class="asb-info">
            <b>دشاوي</b>
            <span>لوحة إدارة المنصة</span>
          </div>
        </div>

        <nav class="adm-sidebar-nav">
          <div class="adm-nav-section">عام</div>
          <a class="adm-nav-item" id="nav-stats" href="/admin/dashboard"
            ><i class="fa-solid fa-gauge-high"></i> الإحصائيات</a
          >
          <a class="adm-nav-item" id="nav-requests" href="/admin/requests"
            ><i class="fa-solid fa-list-check"></i> الطلبات</a
          >
          <a class="adm-nav-item" id="nav-technicians" href="/admin/technicians"
            ><i class="fa-solid fa-users-gear"></i> الفنيون</a
          >

          <div class="adm-nav-section">المالية</div>
          <a class="adm-nav-item active" id="nav-finance" href="/admin/finance"
            ><i class="fa-solid fa-file-invoice-dollar"></i> المالية<span
              class="badge"
              id="nav-finance-count"
              style="
                margin-inline-start: auto;
                font-size: 0.68rem;
                padding: 2px 8px;
                border-radius: 10px;
                display: none;
              "
              >0</span
            ></a
          >
          <a class="adm-nav-item" id="nav-wallets" href="/admin/wallets"
            ><i class="fa-solid fa-wallet"></i> المحافظ</a
          >

          <div class="adm-nav-section">المحتوى</div>
          <a class="adm-nav-item" id="nav-reviews" href="/admin/reviews"
            ><i class="fa-solid fa-star"></i> المراجعات</a
          >
          <a class="adm-nav-item" id="nav-customers" href="/admin/customers"
            ><i class="fa-solid fa-people-group"></i> العملاء</a
          >
          <a class="adm-nav-item" id="nav-specialties" href="/admin/specialties"
            ><i class="fa-solid fa-tags"></i> التخصصات</a
          >
          <a class="adm-nav-item" id="nav-data-requests" href="/admin/data-requests"
            ><i class="fa-solid fa-scale-balanced"></i> طلبات البيانات</a
          >

          <div class="adm-nav-section">النظام</div>
          <a class="adm-nav-item" id="nav-settings" href="/admin/settings"
            ><i class="fa-solid fa-gear"></i> الإعدادات</a
          >
          <a class="adm-nav-item" href="/admin/admins" id="nav-admins" style="display: none">
            <i class="fa-solid fa-user-shield"></i> المسؤولون
          </a>
        </nav>

        <div class="adm-sidebar-user">
          <span class="asu-avatar" id="side-avatar">إ</span>
          <div class="asu-info">
            <b id="side-name">مدير</b>
            <span>إدارة النظام</span>
          </div>
          <a class="btn btn-soft btn-sm" href="/change-password.html" title="تغيير كلمة المرور">
            <i class="fa-solid fa-key"></i>
          </a>
          <button
            class="btn btn-soft-danger btn-sm"
            onclick="Auth.logout('/admin')"
            title="تسجيل الخروج"
          >
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </aside>
      <div class="adm-backdrop" id="sidebar-backdrop"></div>

      <div class="adm-main">
        <header class="adm-topbar">
          <button class="adm-mobile-toggle" id="sidebar-toggle" aria-label="القائمة">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="atb-title" id="tb-title">المالية</div>
          <div class="atb-spacer"></div>
          <button class="atb-btn" id="refresh-btn" title="تحديث">
            <i class="fa-solid fa-rotate"></i>
          </button>
          <a class="atb-btn" href="/" target="_blank" title="الموقع"
            ><i class="fa-solid fa-globe"></i
          ></a>
        </header>

        <main class="adm-content">
          <div class="page-head">
            <div>
              <h1>المالية</h1>
              <div class="sub">تسوية مدفوعات الطلبات، أرصدة الفنيين، وأسعار الخدمات</div>
            </div>
          </div>

          <div class="adm-stat-row" id="stat-row"></div>

          <div class="btn-tabs" style="margin-bottom: 16px">
            <button class="tab active" data-tab="payments">
              <i class="fa-solid fa-receipt"></i> طلبات التسوية
            </button>
            <button class="tab" data-tab="wallets">
              <i class="fa-solid fa-wallet"></i> محافظ الفنيين
            </button>
            <!-- Tariff editing is guarded by the 'settings' permission on the API, so
               the tab is only offered to an admin who actually has it. -->
            <button class="tab" data-tab="pricing" id="pricing-tab">
              <i class="fa-solid fa-tags"></i> أسعار الخدمات
            </button>
          </div>

          <div id="tab-content"></div>
        </main>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/admin.js"></script>
    <script>
      (async () => {
        if (!(await Admin.init())) throw new Error('redirect');

        Admin.hideUnauthorizedNav();
        const me = Auth.getUser();
        if (me && me.is_super_admin) {
          const el = document.getElementById('nav-admins');
          if (el) el.style.display = '';
        }
        const user = Auth.getUser();
        document.getElementById('side-name').textContent = user.email;
        document.getElementById('side-avatar').textContent = Ui.initials('الإدارة');
        document.getElementById('tb-title').textContent = 'المالية';

        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        const sbtn = document.getElementById('sidebar-toggle');
        backdrop.addEventListener('click', () => {
          sidebar.classList.remove('open');
          backdrop.classList.remove('show');
        });
        sbtn.addEventListener('click', () => {
          sidebar.classList.add('open');
          backdrop.classList.add('show');
        });
        const mq = window.matchMedia('(max-width:1024px)');
        mq.addEventListener('change', (e) => {
          sbtn.style.display = e.matches ? '' : 'none';
        });
        sbtn.style.display = mq.matches ? '' : 'none';

        const CAN_PRICE = Admin.has('settings');
        if (!CAN_PRICE) document.getElementById('pricing-tab').style.display = 'none';

        const PAGE_SIZE = 10;

        // ============================================================
        // State
        // ============================================================
        let tab = 'payments';
        let payments = [];
        let wallets = [];
        let pricing = [];
        let moneySettings = { commission_percent: '', wallet_debt_limit: '' };
        let payPage = 1;
        let walletPage = 1;

        const contentEl = document.getElementById('tab-content');

        // ============================================================
        // Formatting helpers
        // ============================================================
        // Two decimals everywhere, even for whole amounts: the tariff is money and
        // "150.00 ج.م" never disagrees with "150.30 ج.م" on the same screen.
        function money(n) {
          return Number(n || 0).toFixed(2) + ' ج.م';
        }

        // Signed form for the ledger, where the direction is the message.
        function signedMoney(n) {
          const v = Number(n || 0);
          return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(2) + ' ج.م';
        }

        const TX_LABELS = {
          payment: 'أرباح مضافة',
          debt: 'عمولة على الفني',
          payout: 'تحويل للمنصة',
          adjustment: 'تسوية يدوية',
        };
        const TX_BADGE = {
          payment: 'green',
          debt: 'red',
          payout: 'blue',
          adjustment: 'yellow',
        };

        const PAYMENT_STATUS = {
          unpaid: { label: 'غير مدفوع', badge: 'red' },
          pending_verification: { label: 'بانتظار التأكيد', badge: 'yellow' },
          confirmed: { label: 'مؤكد', badge: 'green' },
          refunded: { label: 'مسترد', badge: 'gray' },
        };

        // ============================================================
        // Summary cards
        // ============================================================
        // The money figures are summed from the rows already on screen rather than
        // from a separate aggregate endpoint: the pending queue and the wallet list
        // are both small (100 / all technicians), so a second request would only add
        // latency and could disagree with the tables if a settlement lands in between.
        function statCard(value, label, icon, accent) {
          return Ui.el('div', { class: 'adm-stat ' + accent }, [
            Ui.el('span', { class: 'as-icon' }, [Ui.ic(icon)]),
            Ui.el('div', { class: 'as-info' }, [
              Ui.el('b', {}, [String(value)]),
              Ui.el('span', {}, [label]),
            ]),
          ]);
        }

        function renderStats() {
          const row = document.getElementById('stat-row');
          Ui.clear(row);

          const pendingTotal = payments.reduce((sum, r) => sum + Number(r.service_price || 0), 0);
          const pendingCommission = payments.reduce(
            (sum, r) => sum + Number(r.commission_amount || 0),
            0
          );
          const debt = wallets
            .filter((w) => Number(w.balance || 0) < 0)
            .reduce((sum, w) => sum + Math.abs(Number(w.balance || 0)), 0);
          const credit = wallets
            .filter((w) => Number(w.balance || 0) > 0)
            .reduce((sum, w) => sum + Number(w.balance || 0), 0);

          row.appendChild(
            statCard(
              payments.length,
              'طلبات بانتظار التسوية',
              'fa-solid fa-hourglass-half',
              'accent-orange'
            )
          );
          row.appendChild(
            statCard(
              money(pendingTotal),
              'قيمة التسويات المعلّقة',
              'fa-solid fa-sack-dollar',
              'accent-blue'
            )
          );
          row.appendChild(
            statCard(
              money(pendingCommission),
              'عمولة المنصة عليها',
              'fa-solid fa-percent',
              'accent-green'
            )
          );
          row.appendChild(
            statCard(
              money(debt),
              'مستحق على الفنيين',
              'fa-solid fa-triangle-exclamation',
              'accent-red'
            )
          );
          row.appendChild(
            statCard(
              money(credit),
              'أرصدة مدينة للمنصة',
              'fa-solid fa-hand-holding-dollar',
              'accent-purple'
            )
          );

          // Sidebar badge: how much work is waiting on this page. Hidden at zero so a
          // clean queue does not look like a failing count.
          const badge = document.getElementById('nav-finance-count');
          badge.textContent = payments.length;
          badge.style.display = payments.length > 0 ? '' : 'none';
        }

        // ============================================================
        // Payments tab
        // ============================================================
        function renderPayments() {
          if (!payments.length) {
            return Ui.el('div', { class: 'adm-card' }, [
              Ui.el('div', { class: 'adm-empty' }, [
                Ui.ic('fa-solid fa-circle-check'),
                Ui.el('b', {}, ['كل الطلبات متسوّدة']),
                Ui.el('span', {}, ['لا توجد طلبات مكتملة في انتظار تأكيد الدفع.']),
              ]),
            ]);
          }

          const card = Ui.el('div', { class: 'adm-card' });
          const wrap = Ui.el('div', { class: 'adm-table-wrap' });
          const table = Ui.el('table', { class: 'adm-table' }, [
            Ui.el('thead', {}, [
              Ui.el('tr', {}, [
                Ui.el('th', {}, ['#']),
                Ui.el('th', {}, ['العميل']),
                Ui.el('th', {}, ['الخدمة']),
                Ui.el('th', {}, ['الفني']),
                Ui.el('th', {}, ['المبلغ']),
                Ui.el('th', {}, ['عمولة المنصة']),
                Ui.el('th', {}, ['صافي الفني']),
                Ui.el('th', {}, ['أُنجز']),
                Ui.el('th', { attrs: { style: 'text-align:left' } }, ['إجراء']),
              ]),
            ]),
          ]);
          const tbody = Ui.el('tbody');

          const pages = Math.max(1, Math.ceil(payments.length / PAGE_SIZE));
          if (payPage > pages) payPage = pages;
          const start = (payPage - 1) * PAGE_SIZE;
          payments.slice(start, start + PAGE_SIZE).forEach((r) => {
            const m = Ui.meta(r.specialty);
            const status = PAYMENT_STATUS[r.payment_status] || PAYMENT_STATUS.unpaid;

            tbody.appendChild(
              Ui.el('tr', {}, [
                Ui.el('td', {}, ['#' + r.id]),
                Ui.el('td', {}, [
                  Ui.el('div', { class: 'tbl-user' }, [
                    Ui.el(
                      'span',
                      {
                        class: 'avatar',
                        attrs: { style: 'width:30px;height:30px;font-size:0.7rem' },
                      },
                      [Ui.initials(r.customer_name)]
                    ),
                    Ui.escapeHtml(r.customer_name || '—'),
                  ]),
                ]),
                Ui.el('td', {}, [
                  Ui.el(
                    'span',
                    {
                      class: 'badge',
                      attrs: { style: 'background:' + m.bg + ';color:' + m.color },
                    },
                    [Ui.ic(m.icon), m.label]
                  ),
                  r.payment_status && PAYMENT_STATUS[r.payment_status]
                    ? Ui.el('div', { style: 'margin-top:5px' }, [
                        Ui.el('span', { class: 'adm-badge ' + status.badge }, [status.label]),
                      ])
                    : null,
                ]),
                Ui.el('td', {}, [
                  r.technician_name
                    ? Ui.escapeHtml(r.technician_name)
                    : Ui.el('span', { class: 'muted' }, ['—']),
                ]),
                Ui.el('td', {}, [money(r.service_price)]),
                Ui.el('td', {}, [
                  money(r.commission_amount),
                  Ui.el('span', { class: 'tbl-sub', attrs: { style: 'display:block' } }, [
                    Number(r.commission_percent || 0) + '%',
                  ]),
                ]),
                Ui.el('td', {}, [money(r.technician_earning)]),
                Ui.el('td', {}, [Ui.dateTime(r.completed_at)]),
                Ui.el('td', {}, [
                  Ui.el('div', { style: 'display:flex;gap:6px;justify-content:flex-start' }, [
                    Ui.el(
                      'button',
                      { class: 'btn btn-soft-brand btn-sm', attrs: { 'data-confirm': r.id } },
                      [Ui.ic('fa-solid fa-circle-check'), 'تأكيد الدفع']
                    ),
                    Ui.el(
                      'button',
                      { class: 'btn btn-ghost btn-sm', attrs: { 'data-view': r.id } },
                      [Ui.ic('fa-regular fa-eye')]
                    ),
                    Ui.el(
                      'button',
                      { class: 'btn btn-soft-danger btn-sm', attrs: { 'data-refund': r.id } },
                      [Ui.ic('fa-solid fa-rotate-left')]
                    ),
                  ]),
                ]),
              ])
            );
          });

          table.appendChild(tbody);
          wrap.appendChild(table);
          card.appendChild(wrap);
          card.appendChild(
            Ui.paginate(payments.length, payPage, PAGE_SIZE, (p) => {
              payPage = p;
              render();
            })
          );
          return card;
        }

        // The settlement modal. CASH ONLY — the platform has no gateway, so there
        // is no instapay leg to settle. Offering it would let an admin credit a
        // technician's earning against a transfer the platform cannot receive.
        function openConfirmModal(r) {
          const methodSel = Ui.el('select', { class: 'input', id: 'pay-method' }, [
            Ui.el('option', { text: 'كاش — العميل دفع للفني', attrs: { value: 'cash' } }),
          ]);
          const refInput = Ui.el('input', {
            class: 'input',
            attrs: {
              id: 'pay-ref',
              placeholder: 'رقم التحويل أو إشعار الدفع (اختياري)',
              maxlength: '120',
            },
          });
          const noteInput = Ui.el('textarea', {
            class: 'input',
            attrs: { rows: '2', maxlength: '300', placeholder: 'ملاحظة (اختياري)' },
          });

          const explain = Ui.el('div', { class: 'form-hint', id: 'pay-explain' });
          function paintExplain() {
            Ui.clear(explain);
            const cash = methodSel.value === 'cash';
            explain.appendChild(
              Ui.ic(cash ? 'fa-solid fa-triangle-exclamation' : 'fa-solid fa-circle-info')
            );
            explain.appendChild(
              document.createTextNode(
                cash
                  ? ' العميل دفع نقداً للفنّي، فتصبح عمولة المنصة (' +
                      money(r.commission_amount) +
                      ') دَيناً على محفظته. لن يُضاف شيء لمحفظته لأنه يملك المبلغ كاملاً.'
                  : ' العميل دفع للمنصة، فيُضاف صافي الفني (' +
                      money(r.technician_earning) +
                      ') إلى محفظته وتُحصل عمولة المنصة (' +
                      money(r.commission_amount) +
                      ') لصالح المنصة.'
              )
            );
          }
          methodSel.addEventListener('change', paintExplain);
          paintExplain();

          const body = Ui.el('div', {}, [
            Ui.el('div', { class: 'detail-grid', style: 'margin-bottom:14px' }, [
              Ui.el('div', { class: 'detail-row' }, [
                Ui.el('span', { class: 'dk' }, ['الطلب']),
                Ui.el('span', { class: 'dv' }, ['#' + r.id + ' — ' + Ui.meta(r.specialty).label]),
              ]),
              Ui.el('div', { class: 'detail-row' }, [
                Ui.el('span', { class: 'dk' }, ['العميل']),
                Ui.el('span', { class: 'dv' }, [
                  Ui.escapeHtml(r.customer_name || '—') +
                    (r.customer_phone ? ' — ' + r.customer_phone : ''),
                ]),
              ]),
              Ui.el('div', { class: 'detail-row' }, [
                Ui.el('span', { class: 'dk' }, ['الفني']),
                Ui.el('span', { class: 'dv' }, [
                  Ui.escapeHtml(r.technician_name || '—') +
                    (r.technician_phone ? ' — ' + r.technician_phone : ''),
                ]),
              ]),
              Ui.el('div', { class: 'detail-row' }, [
                Ui.el('span', { class: 'dk' }, ['المبلغ']),
                Ui.el('span', { class: 'dv' }, [money(r.service_price)]),
              ]),
              Ui.el('div', { class: 'detail-row' }, [
                Ui.el('span', { class: 'dk' }, ['عمولة المنصة']),
                Ui.el('span', { class: 'dv' }, [
                  money(r.commission_amount) + ' (' + Number(r.commission_percent || 0) + '%)',
                ]),
              ]),
              Ui.el('div', { class: 'detail-row' }, [
                Ui.el('span', { class: 'dk' }, ['صافي الفني']),
                Ui.el('span', { class: 'dv' }, [money(r.technician_earning)]),
              ]),
            ]),
            Ui.el('div', { class: 'form-group' }, [
              Ui.el('label', { class: 'form-label', attrs: { for: 'pay-method' } }, [
                'طريقة الدفع',
              ]),
              methodSel,
              explain,
            ]),
            Ui.el('div', { class: 'form-group' }, [
              Ui.el('label', { class: 'form-label', attrs: { for: 'pay-ref' } }, ['رقم العملية']),
              refInput,
            ]),
            Ui.el('div', { class: 'form-group' }, [
              Ui.el('label', { class: 'form-label' }, ['ملاحظة']),
              noteInput,
            ]),
          ]);

          const confirmBtn = Ui.el(
            'button',
            {
              class: 'btn btn-brand',
              on: {
                click: async () => {
                  Ui.btnLoading(confirmBtn, 'جارٍ التأكيد…');
                  try {
                    await api('/api/admin/payments/' + r.id + '/confirm', {
                      method: 'POST',
                      body: {
                        method: methodSel.value,
                        reference: refInput.value.trim() || null,
                        note: noteInput.value.trim() || null,
                      },
                    });
                    toast('تم تأكيد الدفع', 'success');
                    Ui.openModal(null, null, null, { onClose: null });
                    await load();
                  } catch (err) {
                    toast(err.message, 'error');
                    Ui.btnReset(confirmBtn);
                  }
                },
              },
            },
            [Ui.ic('fa-solid fa-check'), 'تأكيد الدفع']
          );

          Ui.openModal(
            {
              title: 'تسوية الطلب #' + r.id,
              icon: {
                cls: 'fa-solid fa-file-invoice-dollar',
                bg: 'var(--success-50)',
                color: 'var(--success-700)',
              },
            },
            body,
            [
              Ui.el(
                'button',
                { class: 'btn btn-soft', attrs: { type: 'button', onclick: 'closeModal()' } },
                ['إلغاء']
              ),
              confirmBtn,
            ]
          );
        }

        function openRefundModal(r) {
          const body = Ui.el('div', {}, [
            Ui.el('p', { class: 'muted', style: 'line-height:1.8;margin-bottom:12px' }, [
              'سيتم تسجيل الطلب #' + r.id + ' كطلب مسترد، ولن يدخل في قائمة التسويات.',
            ]),
            Ui.el('div', { class: 'form-hint' }, [
              Ui.ic('fa-solid fa-circle-info'),
              document.createTextNode(
                ' تسجيل الاسترداد لا يعكس أي حركة في محفظة الفني تلقائياً — قد يكون الرصيد قد أُصرف بالفعل. سجّل التعديل يدوياً من تبويب "محافظ الفنيين" لو محتاج توازن الميزان.'
              ),
            ]),
          ]);

          const confirmBtn = Ui.el(
            'button',
            {
              class: 'btn btn-soft-danger',
              on: {
                click: async () => {
                  Ui.btnLoading(confirmBtn, 'جارٍ التسجيل…');
                  try {
                    await api('/api/admin/payments/' + r.id + '/refund', { method: 'POST' });
                    toast('تم تسجيل الاسترداد', 'success');
                    Ui.openModal(null, null, null, { onClose: null });
                    await load();
                  } catch (err) {
                    toast(err.message, 'error');
                    Ui.btnReset(confirmBtn);
                  }
                },
              },
            },
            [Ui.ic('fa-solid fa-rotate-left'), 'تسجيل الاسترداد']
          );

          Ui.openModal(
            {
              title: 'استرداد الطلب #' + r.id,
              icon: {
                cls: 'fa-solid fa-triangle-exclamation',
                bg: 'var(--danger-50)',
                color: 'var(--danger-700)',
              },
            },
            body,
            [
              Ui.el(
                'button',
                { class: 'btn btn-soft', attrs: { type: 'button', onclick: 'closeModal()' } },
                ['إلغاء']
              ),
              confirmBtn,
            ]
          );
        }

                Ui.ic('fa-solid fa-wallet'),

          const card = Ui.el('div', { class: 'adm-card' });

          const table = Ui.el('table', { class: 'adm-table' }, [
            Ui.el('thead', {}, [
              Ui.el('tr', {}, [
                Ui.el('th', {}, ['الفني']),
                Ui.el('th', {}, ['التخصص']),
                Ui.el('th', {}, ['الرصيد']),
                Ui.el('th', {}, ['إجمالي الأرباح']),

              ]),
            ]),
          ]);
          const tbody = Ui.el('tbody');

          const pages = Math.max(1, Math.ceil(wallets.length / PAGE_SIZE));
          if (walletPage > pages) walletPage = pages;
          const start = (walletPage - 1) * PAGE_SIZE;
          wallets.slice(start, start + PAGE_SIZE).forEach((w) => {
            const balance = Number(w.balance || 0);
            const debt = Number(w.total_debt || 0);
            const m = Ui.meta(w.specialty);
            tbody.appendChild(
              Ui.el('tr', {}, [
                Ui.el('td', {}, [
                  Ui.el('div', { class: 'tbl-user' }, [
                    Ui.el(
                      'span',
                      {
                        class: 'avatar',
                        attrs: { style: 'width:30px;height:30px;font-size:0.7rem' },
                      },

          card.appendChild(
            Ui.paginate(wallets.length, walletPage, PAGE_SIZE, (p) => {
              walletPage = p;
              render();
            })
          );
          return card;

                min: '0',

                inputmode: 'decimal',
                value: String(p.price || 0),

            });

                priceInput.classList.add('invalid');
                priceInput.focus();
                return;
              }

                  method: 'PUT',
                  body: { price, is_active: activeInput.checked ? 1 : 0 },

                p.price = price;
                p.is_active = activeInput.checked ? 1 : 0;
                toast('تم تحديث سعر ' + (p.label || p.service_key), 'success');

                toast(err.message, 'error');
              }

                Ui.el('td', {}, [

          const commissionInput = Ui.el('input', {

              toast(err.message, 'error');

            Ui.btnReset(saveMoneyBtn);

          card.appendChild(
            Ui.el('div', { class: 'adm-card-head', attrs: { style: 'margin:20px 0 14px' } }, [
              Ui.el('h3', {}, ['نسب المنصة وحدودها']),

            Ui.el('div', { class: 'form-group' }, [
              Ui.el('label', { class: 'form-label' }, ['نسبة عمولة المنصة (%)']),

                'عند بلوغ هذا الدين يتوقف الفني عن استقبال الطلبات حتى السداد.',
              ]),
            ]),
          ]);
          moneyGrid.appendChild(saveMoneyBtn);
          card.appendChild(moneyGrid);

          return card;
        }

        // ============================================================
        // Render / load / tabs
        // ============================================================
        function buildTab() {
          if (tab === 'wallets') return renderWallets();
          if (tab === 'pricing') return renderPricing();
          return renderPayments();
        }

        function render() {
          renderStats();
          Ui.clear(contentEl);
          contentEl.appendChild(buildTab());
        }

        async function load() {
          Ui.clear(contentEl);
          contentEl.appendChild(
            Ui.el('div', { class: 'adm-card' }, [
              Ui.el('div', { class: 'adm-empty' }, [
                Ui.ic('fa-solid fa-spinner'),
                Ui.el('b', {}, ['جاري التحميل...']),
              ]),
            ])
          );

          try {
            const [payRes, walletRes] = await Promise.all([
              api('/api/admin/payments/pending'),
              api('/api/admin/wallets'),
            ]);
            payments = payRes.payments || [];
            wallets = walletRes.wallets || [];

            // The tariff editor needs the 'settings' permission; without it the tab is
            // hidden, so these two reads are only worth making when it is visible.
            if (CAN_PRICE) {
              const [pricingRes, settingsRes] = await Promise.all([
                api('/api/admin/pricing'),
                api('/api/admin/settings'),
              ]);
              pricing = pricingRes.pricing || [];
              moneySettings = settingsRes.settings || {};
            }

            render();
          } catch (e) {
            Ui.clear(contentEl);
            contentEl.appendChild(
              Ui.el('div', { class: 'adm-card' }, [
                Ui.el('div', { class: 'adm-empty' }, [
                  Ui.ic('fa-solid fa-triangle-exclamation'),
                  Ui.el('b', {}, ['تعذّر تحميل البيانات المالية']),
                  Ui.el('span', {}, [e.message]),
                ]),
              ])
            );
            toast(e.message, 'error');
          }
        }

        document.querySelectorAll('.tab').forEach((t) => {
          t.addEventListener('click', () => {
            tab = t.dataset.tab;
            document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x === t));
            render();
          });
        });

        contentEl.addEventListener('click', (e) => {
          const confirmBtn = e.target.closest('[data-confirm]');
          if (confirmBtn) {
            const r = payments.find((x) => x.id === Number(confirmBtn.dataset.confirm));
            if (r) openConfirmModal(r);
            return;
          }
          const viewBtn = e.target.closest('[data-view]');
          if (viewBtn) {
            const r = payments.find((x) => x.id === Number(viewBtn.dataset.view));
            if (r) openPaymentDetail(r);
            return;
          }
          const refundBtn = e.target.closest('[data-refund]');
          if (refundBtn) {
            const r = payments.find((x) => x.id === Number(refundBtn.dataset.refund));
            if (r) openRefundModal(r);
            return;
          }
          const txBtn = e.target.closest('[data-tx]');
          if (txBtn) {
            openWalletModal(Number(txBtn.dataset.tx));
            return;
          }
          const payoutBtn = e.target.closest('[data-payout]');
          if (payoutBtn) {
            const w = wallets.find((x) => x.technician_id === Number(payoutBtn.dataset.payout));
            if (w) openPayoutModal(w);
          }
        });

        document.getElementById('refresh-btn').addEventListener('click', load);

        window.closeModal = () => Ui.openModal(null, null, null, { onClose: null });

        load();
      })();
    </script>
  </body>
</html>
