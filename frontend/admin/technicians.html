<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/dashawy-brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/dashawy-brand/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/dashawy-brand/apple-touch-icon.png">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>الفنيون — دشاوي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/admin/_admin.css">
  <style>
    #pending-tab.has-pending { border-color: #ef4444; color: #b91c1c; }
    #pending-tab.has-pending i { color: #ef4444; }
    .badge-review { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
  </style>
</head>
<body class="adm-body">
  <div class="adm-shell">
    <aside class="adm-sidebar" id="sidebar">
      <div class="adm-sidebar-brand">
        <img class="asb-logo" src="/dashawy-brand/logo-icon.svg" alt="دشاوي">
        <div class="asb-info">
          <b>دشاوي</b>
          <span>لوحة إدارة المنصة</span>
        </div>
      </div>

      <nav class="adm-sidebar-nav">
        <div class="adm-nav-section">عام</div>
        <a class="adm-nav-item" id="nav-stats" href="/admin/dashboard"><i class="fa-solid fa-gauge-high"></i> الإحصائيات</a>
        <a class="adm-nav-item" id="nav-requests" href="/admin/requests"><i class="fa-solid fa-list-check"></i> الطلبات<span class="badge" id="side-pending-count" style="margin-inline-start:auto;font-size:0.68rem;padding:2px 8px;border-radius:10px">0</span></a>
        <a class="adm-nav-item active" id="nav-technicians" href="/admin/technicians"><i class="fa-solid fa-users-gear"></i> الفنيون</a>

        <div class="adm-nav-section">المالية</div>
        <a class="adm-nav-item" id="nav-finance" href="/admin/finance"><i class="fa-solid fa-file-invoice-dollar"></i> المالية<span class="badge" id="nav-finance-count" style="margin-inline-start:auto;font-size:0.68rem;padding:2px 8px;border-radius:10px;display:none">0</span></a>
        <a class="adm-nav-item" id="nav-wallets" href="/admin/wallets"><i class="fa-solid fa-wallet"></i> المحافظ</a>

        <div class="adm-nav-section">المحتوى</div>
        <a class="adm-nav-item" id="nav-reviews" href="/admin/reviews"><i class="fa-solid fa-star"></i> المراجعات</a>
        <a class="adm-nav-item" id="nav-customers" href="/admin/customers"><i class="fa-solid fa-people-group"></i> العملاء</a>
        <a class="adm-nav-item" id="nav-specialties" href="/admin/specialties"><i class="fa-solid fa-tags"></i> التخصصات</a>
        <a class="adm-nav-item" id="nav-data-requests" href="/admin/data-requests"><i class="fa-solid fa-scale-balanced"></i> طلبات البيانات</a>

        <div class="adm-nav-section">النظام</div>
        <a class="adm-nav-item" id="nav-settings" href="/admin/settings"><i class="fa-solid fa-gear"></i> الإعدادات</a>
        <a class="adm-nav-item" href="/admin/admins" id="nav-admins" style="display:none;">
          <i class="fa-solid fa-user-shield"></i> المسؤولون
        </a>
      </nav>

      <div class="adm-sidebar-user">
        <span class="asu-avatar" id="side-avatar">إ</span>
        <div class="asu-info">
          <b id="side-name">مدير</b>
          <span>إدارة النظام</span>
        </div>
        <a class="btn btn-soft btn-sm" href="/change-password.html" title="تغيير كلمة المرور">
          <i class="fa-solid fa-key"></i>
        </a>
        <button class="btn btn-soft-danger btn-sm" onclick="Auth.logout('/admin')" title="تسجيل الخروج"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
    </aside>
    <div class="adm-backdrop" id="sidebar-backdrop"></div>

    <div class="adm-main">
      <header class="adm-topbar">
        <button class="adm-mobile-toggle" id="sidebar-toggle" aria-label="القائمة"><i class="fa-solid fa-bars"></i></button>
        <div class="atb-title" id="tb-title">الفنيون</div>
        <div class="atb-spacer"></div>
        <button class="atb-btn" id="refresh-btn" title="تحديث"><i class="fa-solid fa-rotate"></i></button>
        <a class="atb-btn" href="/" target="_blank" title="الموقع"><i class="fa-solid fa-globe"></i></a>
      </header>

      <main class="adm-content">
        <div class="page-head">
          <div>
            <h1>الفنيون</h1>
            <div class="sub">إدارة حسابات الفنيين والتوفر</div>
          </div>
          <button class="adm-btn primary" id="add-btn"><i class="fa-solid fa-plus"></i> فني جديد</button>
        </div>

        <div class="toolbar">
          <div class="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="search" class="input" placeholder="ابحث بالاسم أو الهاتف أو الإيميل…">
          </div>
          <select id="filter-avail" class="input" style="max-width:150px">
            <option value="">كل الحالات</option>
            <option value="available">متاح</option>
            <option value="busy">مشغول</option>
            <option value="offline">غير متصل</option>
          </select>
          <button class="adm-btn" id="reset-filters"><i class="fa-solid fa-filter-circle-xmark"></i> مسح</button>
        </div>

        <div class="row-between" style="margin:16px 2px 10px">
          <span class="muted">إجمالي الفنيين: <b id="total-count" style="color:var(--adm-ink)">—</b></span>
          <span class="tbl-sub" id="page-info" style="text-align:left"></span>
        </div>

        <div class="btn-tabs mb-14" id="av-tabs">
          <button class="tab" data-status="pending" id="pending-tab">
            <i class="fa-solid fa-hourglass-half"></i> طلبات الانضمام
            <span id="pending-count" style="margin-inline-start:6px;background:var(--danger);color:#fff;border-radius:10px;padding:1px 7px;font-size:0.7rem;font-weight:700;display:none">0</span>
          </button>
          <button class="tab active" data-av="">الكل</button>
          <button class="tab" data-av="available">متاح</button>
          <button class="tab" data-av="busy">مشغول</button>
          <button class="tab" data-av="offline">غير متصل</button>
        </div>

        <div class="adm-card">
          <div class="adm-table-wrap">
            <table class="adm-table">
              <thead>
                <tr><th>الفني</th><th>الهاتف</th><th>الحالة</th><th>منذ</th><th style="text-align:left">إجراءات</th></tr>
              </thead>
              <tbody id="tbody"><tr id="skel-row"></tr></tbody>
            </table>
          </div>
          <div class="pager" id="pager"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    (async () => {
      if (!(await Admin.init())) throw new Error('redirect');

      Admin.hideUnauthorizedNav();
      const me = Auth.getUser();
      if (me && me.is_super_admin) {
        const el = document.getElementById('nav-admins');
        if (el) el.style.display = '';
      }
      const user = Auth.getUser();
      document.getElementById('side-name').textContent = user.email;
      document.getElementById('side-avatar').textContent = Ui.initials('الإدارة');
      document.getElementById('tb-title').textContent = 'الفنيون';

      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      const sbtn = document.getElementById('sidebar-toggle');
      backdrop.addEventListener('click', () => { sidebar.classList.remove('open'); backdrop.classList.remove('show'); });
      sbtn.addEventListener('click', () => { sidebar.classList.add('open'); backdrop.classList.add('show'); });
      const mq = window.matchMedia('(max-width:1024px)');
      mq.addEventListener('change', (e) => { sbtn.style.display = e.matches ? '' : 'none'; });
      sbtn.style.display = mq.matches ? '' : 'none';

      let all = [];
      let page = 1;
      const SIZE = 6;
      const searchEl = document.getElementById('search');
      const sliceAvailEl = document.getElementById('filter-avail');
      let pendingMode = false;
      let pendingList = [];

      function dataAvail(t) {
        if (t.availability) return t.availability;
        if (t.is_available !== undefined) return t.is_available ? 'available' : 'offline';
        return 'offline';
      }

      function filtered() {
        const q = searchEl.value.trim().toLowerCase();
        const avail = sliceAvailEl.value;
        return all.filter((t) => {
          if (avail && dataAvail(t) !== avail) return false;
          if (q && !(t.name + ' ' + t.phone + ' ' + (t.account_phone || '') + ' ' + t.email).toLowerCase().includes(q)) return false;
          return true;
        });
      }

      function render() {
        const rows = pendingMode ? pendingList : filtered();
        document.getElementById('total-count').textContent = rows.length;
        const pages = Math.max(1, Math.ceil(rows.length / SIZE));
        if (page > pages) page = pages;
        const start = (page - 1) * SIZE;
        const slice = rows.slice(start, start + SIZE);
        document.getElementById('page-info').textContent = (rows.length ? start + 1 : 0) + '–' + (start + slice.length) + ' من ' + rows.length;

        const tbody = document.getElementById('tbody');
        Ui.clear(tbody);
        if (!rows.length) {
          tbody.appendChild(Ui.el('tr', {}, [Ui.el('td', { attrs: { colspan: 5 } }, [pendingMode ? 'لا توجد طلبات انضمام بانتظار المراجعة' : 'لا يوجد فنيون مطابقون لبحثك'])]));
          Ui.clear(document.getElementById('pager'));
          return;
        }
        slice.forEach((t) => {
          let statusCell, actionsCell;
          if (pendingMode) {
            statusCell = Ui.el('span', { class: 'badge badge-review' }, [Ui.ic('fa-solid fa-hourglass-half'), 'قيد المراجعة']);
            actionsCell = Ui.el('div', { style: 'display:flex;gap:6px;justify-content:flex-start', dir: 'ltr' }, [
              Ui.el('button', { class: 'btn btn-soft btn-sm', attrs: { 'data-doc': t.id, title: 'عرض المستندات' } }, [Ui.ic('fa-solid fa-folder-open'), 'المستندات']),
              Ui.el('button', { class: 'btn btn-soft-success btn-sm', attrs: { 'data-approve': t.id, title: 'قبول' } }, [Ui.ic('fa-solid fa-check'), 'قبول']),
              Ui.el('button', { class: 'btn btn-soft-danger btn-sm', attrs: { 'data-reject': t.id, title: 'رفض' } }, [Ui.ic('fa-solid fa-xmark'), 'رفض'])
            ]);
          } else {
            statusCell = Ui.availBadge(dataAvail(t));
            actionsCell = Ui.el('div', { style: 'display:flex;gap:6px;justify-content:flex-start', dir: 'ltr' }, [
              Ui.el('button', { class: 'btn btn-ghost btn-sm', attrs: { 'data-view': t.id, title: 'العرض' } }, [Ui.ic('fa-regular fa-eye')]),
              Ui.el('button', {
                class: 'btn btn-icon btn-soft',
                attrs: { 'data-reset-pwd': t.id, title: 'إعادة تعيين كلمة المرور' }
              }, [Ui.ic('fa-solid fa-key')]),
              Ui.el('button', { class: 'btn btn-icon btn-soft-brand', attrs: { 'data-edit': t.id, title: 'تعديل' } }, [Ui.ic('fa-solid fa-pen')]),
              Ui.el('button', { class: 'btn btn-icon btn-soft', attrs: { 'data-avail': t.id, title: 'تبديل التوفر' } }, [Ui.ic('fa-solid fa-power-off')]),
              Ui.el('button', { class: 'btn btn-icon btn-soft-danger', attrs: { 'data-del': t.id, title: 'حذف' } }, [Ui.ic('fa-solid fa-trash')])
            ]);
          }
          tbody.appendChild(Ui.el('tr', {}, [
            Ui.el('td', {}, [Ui.el('div', { class: 'tbl-user' }, [Ui.el('span', { class: 'avatar' }, [Ui.initials(t.name)]), Ui.el('div', {}, [Ui.el('div', { class: 'tbl-main' }, [Ui.escapeHtml(t.name)]), Ui.el('div', { class: 'tbl-sub' }, [Ui.escapeHtml(t.email)])])])]),
            Ui.el('td', {}, [Ui.el('span', { dir: 'ltr' }, [t.phone || t.account_phone || '—'])]),
            Ui.el('td', {}, [statusCell]),
            Ui.el('td', {}, [Ui.dateTime(t.created_at)]),
            Ui.el('td', {}, [actionsCell])
          ]));
        });
        Ui.paginate(document.getElementById('pager'), rows.length, page, SIZE, (p) => { page = p; render(); });
      }

      async function loadPending() {
        const countEl = document.getElementById('pending-count');
        const tabBtn = document.getElementById('pending-tab');
        try {
          const data = await api('/api/admin/technicians/pending');
          pendingList = data.technicians || [];
          const n = pendingList.length;
          countEl.textContent = n;
          countEl.style.display = n > 0 ? '' : 'none';
          tabBtn.classList.toggle('has-pending', n > 0);
        } catch (e) { console.error(e); }
        if (pendingMode) { page = 1; render(); }
      }

      async function load() {
        const tbody = document.getElementById('tbody');
        Ui.clear(tbody);
        tbody.appendChild(Ui.skeletonTable(6, 6));
        try {
          const data = await api('/api/admin/technicians');
          all = data.technicians || [];
          render();
        } catch (e) { toast(e.message, 'error'); }
      }

      document.querySelectorAll('#av-tabs .tab').forEach((t) => {
        t.addEventListener('click', () => {
          document.querySelectorAll('#av-tabs .tab').forEach((x) => x.classList.remove('active'));
          t.classList.add('active');
          if (t.id === 'pending-tab') {
            pendingMode = true;
          } else {
            pendingMode = false;
            sliceAvailEl.value = t.dataset.av;
          }
          page = 1;
          render();
        });
      });

      searchEl.addEventListener('input', () => { page = 1; render(); });
      sliceAvailEl.addEventListener('change', () => { page = 1; render(); });
      document.getElementById('reset-filters').addEventListener('click', () => {
        pendingMode = false;
        searchEl.value = '';
        sliceAvailEl.value = '';
        document.querySelectorAll('#av-tabs .tab').forEach((x) => x.classList.remove('active'));
        document.querySelector('#av-tabs .tab:not(#pending-tab)').classList.add('active');
        page = 1;
        render();
      });
      document.getElementById('refresh-btn').addEventListener('click', load);

      document.getElementById('tbody').addEventListener('click', async (e) => {
        const resetBtn = e.target.closest('[data-reset-pwd]');
        if (resetBtn) {
          const techId = Number(resetBtn.dataset.resetPwd);
          const tech = all.find((x) => x.id === techId);
          if (tech) {
            openResetPasswordModal({
              displayName: tech.name,
              submitUrl: '/api/admin/technicians/' + techId + '/reset-password'
            });
          }
          return;
        }
        const btn = e.target.closest('[data-edit],[data-avail],[data-del],[data-view]');
        if (!btn) return;
        const id = Number(btn.dataset.edit || btn.dataset.avail || btn.dataset.del || btn.dataset.view);
        const tech = all.find((t) => t.id === id);
        if (btn.hasAttribute('data-del')) {
          if (!confirm('حذف الفني «' + tech.name + '» نهائياً؟')) return;
          Ui.btnLoading(btn, '');
          try {
            const data = await api('/api/admin/technicians/' + id, { method: 'DELETE' });
            toast(data.message, 'success');
            load();
          } catch (err) { toast(err.message, 'error'); Ui.btnReset(btn); }
          return;
        }
        if (btn.hasAttribute('data-avail')) {
          Ui.btnLoading(btn, '');
          try {
            const cur = dataAvail(tech);
            const next = cur === 'available' ? 'busy' : cur === 'busy' ? 'offline' : 'available';
            const data = await api('/api/admin/technicians/' + id, { method: 'PUT', body: { availability: next } });
            toast(data.message, 'success');
            load();
          } catch (err) { toast(err.message, 'error'); Ui.btnReset(btn); }
          return;
        }
        if (btn.hasAttribute('data-edit')) { openTechModal(tech); return; }
        Ui.btnLoading(btn, '');
        try {
          const data = await api('/api/admin/technicians/' + id);
          Ui.btnReset(btn);
          openTechDetail(data);
        } catch (err) {
          Ui.btnReset(btn);
          toast(err.message, 'error');
        }
      });

      function openResetPasswordModal({ displayName, submitUrl }) {
        const body = Ui.el('div', {}, [
          Ui.el('p', { style: 'color:var(--muted);font-size:0.87rem;margin-bottom:16px;line-height:1.7' }, [
            'إعادة تعيين كلمة المرور لـ ',
            Ui.el('b', { style: 'color:var(--ink)' }, [displayName]),
            '. الباسورد الجديد هيشتغل فورًا.'
          ]),
          Ui.el('div', { class: 'form-group' }, [
            Ui.el('label', { class: 'form-label' }, ['كلمة المرور الجديدة']),
            Ui.el('input', { class: 'input', id: 'rp-new', attrs: { type: 'text', minlength: '6', placeholder: '6 أحرف على الأقل' } })
          ]),
          Ui.el('div', { class: 'form-group' }, [
            Ui.el('label', { class: 'form-label' }, ['تأكيد كلمة المرور']),
            Ui.el('input', { class: 'input', id: 'rp-confirm', attrs: { type: 'text', minlength: '6', placeholder: 'أعد كتابة كلمة المرور' } })
          ]),
          Ui.el('div', { class: 'form-hint', style: 'margin-top:8px' }, [
            Ui.ic('fa-solid fa-circle-info'),
            ' الباسورد هيتنسخ تلقائيًا للحافظة بعد الحفظ.'
          ])
        ]);

        const saveBtn = Ui.el('button', {
          class: 'btn btn-brand',
          on: { click: async () => {
            const a = document.getElementById('rp-new').value;
            const b = document.getElementById('rp-confirm').value;
            if (a.length < 6) { toast('كلمة المرور 6 أحرف على الأقل', 'error'); return; }
            if (a !== b) { toast('كلمتا المرور غير متطابقتين', 'error'); return; }
            Ui.btnLoading(saveBtn, 'جارٍ الحفظ…');
            try {
              const d = await api(submitUrl, { method: 'POST', body: { new_password: a } });
              toast('تم تعيين كلمة المرور المؤقتة. سيُطلب من المستخدم تغييرها عند أول دخول.', 'success');
              try { await navigator.clipboard.writeText(a); } catch (e) {}
              toast('تم نسخ كلمة المرور للحافظة', 'success');
              Ui.openModal(null, null, null, { onClose: null });
            } catch (err) {
              toast(err.message, 'error');
              Ui.btnReset(saveBtn);
            }
          }}
        }, [Ui.ic('fa-solid fa-key'), 'تعيين كلمة المرور']);

        Ui.openModal(
          { title: 'إعادة تعيين كلمة المرور', icon: { cls: 'fa-solid fa-key', bg: '#fef3c7', color: '#b45309' } },
          body,
          saveBtn
        );
      }

      function openTechDetail(data) {
        const t = data.technician;
        const s = data.stats;
        const m = Ui.meta(t.specialty);

        const body = Ui.el('div', {});

        // --- Header: avatar + name + status badges ---
        const head = Ui.el('div', { style: 'display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--line)' }, [
          Ui.el('span', { class: 'avatar', style: 'width:56px;height:56px;font-size:1.1rem' }, [Ui.initials(t.name)]),
          Ui.el('div', { style: 'flex:1' }, [
            Ui.el('div', { style: 'font-weight:800;font-size:1.05rem;color:var(--ink)' }, [Ui.escapeHtml(t.name)]),
            Ui.el('div', { class: 'tbl-sub' }, [Ui.escapeHtml(t.email || '')])
          ]),
          Ui.availBadge(t.availability || 'offline'),
          t.approval_status === 'pending'  ? Ui.el('span', { class: 'badge b-pending' },   ['قيد المراجعة'])
        : t.approval_status === 'rejected' ? Ui.el('span', { class: 'badge b-cancelled' }, ['مرفوض'])
        : Ui.el('span', { class: 'badge b-completed' }, ['معتمد'])
        ]);
        body.appendChild(head);

        // --- Info grid ---
        const info = Ui.el('div', { class: 'detail-grid', style: 'margin-bottom:18px' });
        const row = (k, v) => info.appendChild(Ui.el('div', { class: 'detail-row' }, [
          Ui.el('span', { class: 'dk' }, [k]),
          Ui.el('span', { class: 'dv' }, [v])
        ]));
        row('الهاتف', t.phone ? Ui.el('a', { attrs: { href: 'tel:' + t.phone, dir: 'ltr' } }, [t.phone]) : '—');
        row('المنطقة', Ui.escapeHtml(t.location_text || '—'));
        row('التخصص', Ui.el('span', { class: 'badge', attrs: { style: 'background:' + m.bg + ';color:' + m.color } }, [Ui.ic(m.icon), m.label]));
        row('تاريخ التسجيل', Ui.dateTime(t.created_at || t.account_created_at));
        if (t.approved_at) row('تاريخ الاعتماد', Ui.dateTime(t.approved_at));
        if (t.approval_note) row('ملاحظة الرفض', Ui.escapeHtml(t.approval_note));
        body.appendChild(info);

        // --- Statistics ---
        body.appendChild(Ui.el('h3', { style: 'margin:18px 0 12px;font-size:0.95rem;font-weight:800;color:var(--ink)' }, ['الإحصائيات']));
        const stats = Ui.el('div', { style: 'display:grid;grid-template-columns:repeat(4,1fr);gap:10px' });
        const statBox = (v, l, color) => Ui.el('div', { style: 'background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center' }, [
          Ui.el('b', { style: 'display:block;font-size:1.5rem;color:' + (color || 'var(--ink)') + ';font-weight:900;line-height:1.1' }, [String(v)]),
          Ui.el('span', { style: 'font-size:0.75rem;color:var(--muted);font-weight:600' }, [l])
        ]);
        stats.appendChild(statBox(s.total, 'إجمالي الطلبات'));
        stats.appendChild(statBox(s.completed, 'مكتملة', '#10b981'));
        stats.appendChild(statBox(s.in_progress, 'جارية', '#0ea5e9'));
        stats.appendChild(statBox(s.cancelled, 'ملغاة', '#ef4444'));
        body.appendChild(stats);

        // --- Documents ---
        body.appendChild(Ui.el('h3', { style: 'margin:20px 0 12px;font-size:0.95rem;font-weight:800;color:var(--ink)' }, ['المستندات الرسمية']));

        const docsWrap = Ui.el('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:14px' });

        const docCard = (title, path, iconClass, docType) => {
          const card = Ui.el('div', {
            style: 'background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;min-height:180px;display:flex;flex-direction:column'
          }, [
            Ui.el('div', { style: 'display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;color:var(--ink);font-size:0.87rem;margin-bottom:10px' }, [Ui.ic(iconClass), title])
          ]);

          if (!path) {
            card.appendChild(Ui.el('div', { style: 'color:var(--muted);font-size:0.82rem;padding:20px 0;flex:1;display:grid;place-items:center' }, ['لم يتم رفع هذا المستند']));
            return card;
          }

          const isPdf = path.toLowerCase().endsWith('.pdf');
          if (isPdf) {
            card.appendChild(Ui.el('button', {
              class: 'btn btn-outline btn-sm',
              on: { click: async () => {
                try {
                  const blob = await apiBlob('/api/admin/technicians/' + t.id + '/document/' + docType);
                  const url = URL.createObjectURL(blob);
                  window.open(url, '_blank');
                } catch (e) { toast(e.message, 'error'); }
              }}
            }, [Ui.ic('fa-solid fa-file-pdf'), 'فتح PDF']));
            return card;
          }

          // Image: fetch as blob then set as src
          const imgWrap = Ui.el('div', {
            style: 'flex:1;display:grid;place-items:center;min-height:140px'
          });
          const loading = Ui.el('div', { style: 'color:var(--muted);font-size:0.8rem' }, ['جارٍ تحميل الصورة…']);
          imgWrap.appendChild(loading);
          card.appendChild(imgWrap);

          const hint = Ui.el('div', { style: 'margin-top:8px;font-size:0.72rem;color:var(--muted);display:none' }, ['اضغط على الصورة لفتحها بحجم كامل']);
          card.appendChild(hint);

          (async () => {
            try {
              const blob = await apiBlob('/api/admin/technicians/' + t.id + '/document/' + docType);
              const url = URL.createObjectURL(blob);
              loading.remove();
              const img = Ui.el('img', {
                attrs: {
                  src: url,
                  style: 'max-width:100%;max-height:200px;border-radius:10px;border:1px solid var(--line);cursor:pointer;background:#fff',
                  alt: title
                },
                on: { click: () => window.open(url, '_blank') }
              });
              imgWrap.appendChild(img);
              hint.style.display = '';
            } catch (e) {
              loading.textContent = 'تعذر تحميل الصورة';
              loading.style.color = 'var(--danger)';
            }
          })();

          return card;
        };

        docsWrap.appendChild(docCard('الفيش الجنائي',     t.criminal_record_path, 'fa-solid fa-file-shield', 'criminal_record'));
        docsWrap.appendChild(docCard('بطاقة الرقم القومي', t.national_id_path,     'fa-solid fa-id-card',     'national_id'));
        body.appendChild(docsWrap);

        // --- Recent requests ---
        if (data.recentRequests && data.recentRequests.length) {
          body.appendChild(Ui.el('h3', { style: 'margin:20px 0 12px;font-size:0.95rem;font-weight:800;color:var(--ink)' }, ['آخر 5 طلبات']));
          const list = Ui.el('div', { style: 'display:grid;gap:8px' });
          data.recentRequests.forEach((r) => {
            list.appendChild(Ui.el('div', { style: 'display:flex;align-items:center;gap:10px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:0.83rem' }, [
              Ui.el('span', { style: 'font-weight:700' }, ['#' + r.id]),
              Ui.el('span', { style: 'flex:1;color:var(--muted)' }, [Ui.escapeHtml(r.customer_name || '')]),
              Ui.statusBadge(r.status),
              Ui.el('span', { class: 'tbl-sub' }, [Ui.dateTime(r.created_at)])
            ]));
          });
          body.appendChild(list);
        }

        // --- Footer actions ---
        const footer = Ui.el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start;width:100%' });

        if (t.approval_status === 'pending') {
          footer.appendChild(Ui.el('button', {
            class: 'btn btn-accent btn-sm',
            on: { click: async () => {
              if (!confirm('قبول الفني وتفعيل حسابه؟')) return;
              try {
                const r = await api('/api/admin/technicians/' + t.id + '/approve', { method: 'POST' });
                toast(r.message, 'success');
                Ui.openModal(null, null, null, { onClose: null });
                load();
              } catch (err) { toast(err.message, 'error'); }
            }}
          }, [Ui.ic('fa-solid fa-check'), 'قبول الفني']));

          footer.appendChild(Ui.el('button', {
            class: 'btn btn-soft-danger btn-sm',
            on: { click: async () => {
              const note = prompt('سبب الرفض (اختياري):') || '';
              try {
                const r = await api('/api/admin/technicians/' + t.id + '/reject', { method: 'POST', body: { note } });
                toast(r.message, 'success');
                Ui.openModal(null, null, null, { onClose: null });
                load();
              } catch (err) { toast(err.message, 'error'); }
            }}
          }, [Ui.ic('fa-solid fa-xmark'), 'رفض الطلب']));
        }

        footer.appendChild(Ui.el('button', {
          class: 'btn btn-soft-danger btn-sm',
          on: { click: async () => {
            if (!confirm('حذف الفني «' + t.name + '» نهائياً؟ سيتم حذف كل طلباته أيضاً.')) return;
            try {
              const r = await api('/api/admin/technicians/' + t.id, { method: 'DELETE' });
              toast(r.message, 'success');
              Ui.openModal(null, null, null, { onClose: null });
              load();
            } catch (err) { toast(err.message, 'error'); }
          }}
        }, [Ui.ic('fa-solid fa-trash'), 'حذف الفني']));

        footer.appendChild(Ui.el('button', {
          class: 'btn btn-soft',
          on: { click: () => Ui.openModal(null, null, null, { onClose: null }) }
        }, ['إغلاق']));

        Ui.openModal(
          { title: 'ملف الفني', icon: { cls: 'fa-solid fa-user-gear', bg: '#eef2ff', color: '#4f46e5' } },
          body, footer, { lg: true }
        );
      }

      function openTechModal(tech) {
        const editing = !!tech;
        const f = Ui.el('form', { id: 'tech-form', attrs: { novalidate: '' } });
        appendField(f, 'اسم الفني', '<input class="input" id="t-name" required placeholder="مثال: محمود سعيد">');
        appendField(f, 'الهاتف', '<input class="input" id="t-phone" required placeholder="01xxxxxxxxx">');
        appendField(f, 'الإيميل', '<input class="input" id="t-email" type="email" required placeholder="fani@example.com">');
        appendField(f, 'المنطقة في الإسكندرية',
          '<select class="input" id="t-area"><option value="">اختر منطقتك…</option></select>');

        Ui.openModal(
          editing ? 'تعديل الفني' : 'إضافة فني جديد',
          f,
          modelFooter(editing, tech),
          { onClose: closeModal, onOpen: null }
        );

        (async function loadAreas() {
          const sel = document.getElementById('t-area');
          try {
            const data = await api('/api/alexandria-areas');
            (data.areas || []).forEach((a) => {
              sel.appendChild(Ui.el('option', { text: a.label, attrs: { value: a.key } }));
            });
            if (editing && tech.location_text) {
              const match = (data.areas || []).find((a) => a.label === tech.location_text);
              if (match) sel.value = match.key;
            }
          } catch (e) { console.error(e); }
        })();

        document.getElementById('tech-form').addEventListener('submit', async (ev) => {
          ev.preventDefault();
          clearFormErrors(document);
          const name = document.getElementById('t-name').value.trim();
          const phone = document.getElementById('t-phone').value.trim();
          const email = document.getElementById('t-email').value.trim();
          const area_key = document.getElementById('t-area').value;
          let ok = true;
          if (!name) { setFieldError(document.getElementById('t-name'), 'مطلوب'); ok = false; }
          if (!phone) { setFieldError(document.getElementById('t-phone'), 'مطلوب'); ok = false; }
          if (!email) { setFieldError(document.getElementById('t-email'), 'مطلوب'); ok = false; }
          if (!ok) return;
          const body = { name, phone, email };
          if (area_key) body.area_key = area_key;
          const btn = document.getElementById('save-btn');
          Ui.btnLoading(btn, 'جارٍ الحفظ…');
          try {
            const data = await api('/api/admin/technicians' + (editing ? '/' + tech.id : ''), { method: editing ? 'PUT' : 'POST', body });
            toast(data.message, 'success');
            closeModal();
            load();
          } catch (err) { toast(err.message, 'error'); Ui.btnReset(btn); }
        });
      }

      function appendField(form, label, html) {
        const g = Ui.el('div', { class: 'form-group' });
        g.appendChild(Ui.el('label', { class: 'form-label' }, [label]));
        g.insertAdjacentHTML('beforeend', html);
        form.appendChild(g);
      }

      function modelFooter(editing, tech) {
        return Ui.el('div', { style: 'display:flex;gap:8px;justify-content:flex-start' }, [
          Ui.el('button', { class: 'btn btn-soft', attrs: { type: 'button', onclick: 'closeModal()' } }, ['إلغاء']),
          Ui.el('button', { class: 'btn btn-brand', attrs: { type: 'submit', id: 'save-btn', form: 'tech-form' } }, [editing ? 'حفظ التعديلات' : 'إضافة الفني'])
        ]);
      }

      window.closeModal = () => Ui.openModal(null, null, null, { onClose: null });

      document.getElementById('add-btn').addEventListener('click', () => openTechModal(null));
      load();
    })();
  </script>
</body>
</html>
