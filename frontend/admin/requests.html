<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الطلبات — دشاوي</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/admin/_admin.css" />
  </head>
  <body class="adm-body">
    <div class="adm-shell">
      <aside class="adm-sidebar" id="sidebar">
        <div class="adm-sidebar-brand">
          <span class="asb-logo"><i class="fa-solid fa-satellite-dish"></i></span>
          <div class="asb-info">
            <b>دشاوي</b>
            <span>لوحة إدارة المنصة</span>
          </div>
        </div>

        <nav class="adm-sidebar-nav">
          <div class="adm-nav-section">عام</div>
          <a class="adm-nav-item" id="nav-stats" href="/admin/dashboard"
            ><i class="fa-solid fa-gauge-high"></i> الإحصائيات</a
          >
          <a class="adm-nav-item active" id="nav-requests" href="/admin/requests"
            ><i class="fa-solid fa-list-check"></i> الطلبات<span
              class="badge"
              id="side-pending-count"
              style="
                margin-inline-start: auto;
                font-size: 0.68rem;
                padding: 2px 8px;
                border-radius: 10px;
              "
              >0</span
            ></a
          >
          <a class="adm-nav-item" id="nav-technicians" href="/admin/technicians"
            ><i class="fa-solid fa-users-gear"></i> الفنيون</a
          >

          <div class="adm-nav-section">المالية</div>
          <a class="adm-nav-item" id="nav-finance" href="/admin/finance"
            ><i class="fa-solid fa-file-invoice-dollar"></i> المالية<span
              class="badge"
              id="nav-finance-count"
              style="
                margin-inline-start: auto;
                font-size: 0.68rem;
                padding: 2px 8px;
                border-radius: 10px;
                display: none;
              "
              >0</span
            ></a
          >
          <a class="adm-nav-item" id="nav-wallets" href="/admin/wallets"
            ><i class="fa-solid fa-wallet"></i> المحافظ</a
          >

          <div class="adm-nav-section">المحتوى</div>
          <a class="adm-nav-item" id="nav-reviews" href="/admin/reviews"
            ><i class="fa-solid fa-star"></i> المراجعات</a
          >
          <a class="adm-nav-item" id="nav-customers" href="/admin/customers"
            ><i class="fa-solid fa-people-group"></i> العملاء</a
          >
          <a class="adm-nav-item" id="nav-specialties" href="/admin/specialties"
            ><i class="fa-solid fa-tags"></i> التخصصات</a
          >
          <a class="adm-nav-item" id="nav-data-requests" href="/admin/data-requests"
            ><i class="fa-solid fa-scale-balanced"></i> طلبات البيانات</a
          >

          <div class="adm-nav-section">النظام</div>
          <a class="adm-nav-item" id="nav-settings" href="/admin/settings"
            ><i class="fa-solid fa-gear"></i> الإعدادات</a
          >
          <a class="adm-nav-item" href="/admin/admins" id="nav-admins" style="display: none">
            <i class="fa-solid fa-user-shield"></i> المسؤولون
          </a>
        </nav>

        <div class="adm-sidebar-user">
          <span class="asu-avatar" id="side-avatar">إ</span>
          <div class="asu-info">
            <b id="side-name">مدير</b>
            <span>إدارة النظام</span>
          </div>
          <a class="btn btn-soft btn-sm" href="/change-password.html" title="تغيير كلمة المرور">
            <i class="fa-solid fa-key"></i>
          </a>
          <button
            class="btn btn-soft-danger btn-sm"
            onclick="Auth.logout('/admin')"
            title="تسجيل الخروج"
          >
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </aside>
      <div class="adm-backdrop" id="sidebar-backdrop"></div>

      <div class="adm-main">
        <header class="adm-topbar">
          <button class="adm-mobile-toggle" id="sidebar-toggle" aria-label="القائمة">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="atb-title" id="tb-title">الطلبات</div>
          <div class="atb-spacer"></div>
          <button class="atb-btn" id="refresh-btn" title="تحديث">
            <i class="fa-solid fa-rotate"></i>
          </button>
          <a class="atb-btn" href="/" target="_blank" title="الموقع"
            ><i class="fa-solid fa-globe"></i
          ></a>
        </header>

        <main class="adm-content">
          <div class="page-head">
            <div>
              <h1>الطلبات</h1>
              <div class="sub">تصفية وتتبّع كل طلبات المنصة</div>
            </div>
          </div>

          <div class="toolbar">
            <select id="filter-status" class="input" style="max-width: 165px">
              <option value="">كل الحالات</option>
            </select>
            <select id="filter-specialty" class="input" style="max-width: 170px">
              <option value="">كل التخصصات</option>
            </select>
            <select id="filter-amount-status" class="input" style="max-width: 200px">
              <option value="">كل حالات الدفع</option>
              <option value="pending">بانتظار التأكيد</option>
              <option value="disputed">قيد المراجعة</option>
              <option value="matched">مؤكد</option>
              <option value="resolved">تم الحل</option>
            </select>
            <div class="tb-date">
              <input type="date" id="from-date" class="input" title="من تاريخ" />
              <span class="muted">إلى</span>
              <input type="date" id="to-date" class="input" title="إلى تاريخ" />
            </div>
            <button class="adm-btn" id="reset-filters">
              <i class="fa-solid fa-filter-circle-xmark"></i> مسح
            </button>
          </div>

          <div class="row-between" style="margin: 16px 2px 10px">
            <span class="muted"
              >إجمالي الطلبات: <b id="total-count" style="color: var(--adm-ink)">—</b></span
            >
            <span class="tbl-sub" id="page-info" style="text-align: left"></span>
          </div>

          <div class="adm-card">
            <div class="adm-table-wrap">
              <table class="adm-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>العميل</th>
                    <th>الخدمة</th>
                    <th>الحالة</th>
                    <th>الدفع</th>
                    <th>الفني</th>
                    <th>التاريخ</th>
                    <th style="text-align: left">إجراء</th>
                  </tr>
                </thead>
                <tbody id="tbody"></tbody>
              </table>
            </div>
            <div class="pager" id="pager"></div>
          </div>
        </main>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/admin.js"></script>
    <script>
      (async () => {
        if (!(await Admin.init())) throw new Error('redirect');

        Admin.hideUnauthorizedNav();
        const me = Auth.getUser();
        if (me && me.is_super_admin) {
          const el = document.getElementById('nav-admins');
          if (el) el.style.display = '';
        }
        const user = Auth.getUser();
        document.getElementById('side-name').textContent = user.email;
        document.getElementById('side-avatar').textContent = Ui.initials('الإدارة');
        document.getElementById('tb-title').textContent = 'الطلبات';

        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        const sbtn = document.getElementById('sidebar-toggle');
        backdrop.addEventListener('click', () => {
          sidebar.classList.remove('open');
          backdrop.classList.remove('show');
        });
        sbtn.addEventListener('click', () => {
          sidebar.classList.add('open');
          backdrop.classList.add('show');
        });
        const mq = window.matchMedia('(max-width:1024px)');
        mq.addEventListener('change', (e) => {
          sbtn.style.display = e.matches ? '' : 'none';
        });
        sbtn.style.display = mq.matches ? '' : 'none';

        const STATUS_ORDER = [
          'pending',
          'no_technician',
          'assigned',
          'in_progress',
          'completed',
          'cancelled',
        ];

        // Two-decimal money formatting, matching the other admin pages. A missing
        // figure renders as 0.00 rather than "NaN", which is what an unreported
        // amount would otherwise produce.
        function money(n) {
          return Number(n || 0).toFixed(2) + ' ج.م';
        }

        // The action cell. A stranded request gets a re-broadcast button next to the
        // usual "details", because it is the one status an admin has to act on — the
        // row is otherwise just a dead listing.
        function rowActions(r) {
          const wrap = Ui.el('div', { style: 'display:flex;gap:6px;justify-content:flex-start' });
          if (r.status === 'no_technician') {
            wrap.appendChild(
              Ui.el(
                'button',
                {
                  class: 'btn btn-soft-brand btn-sm',
                  attrs: { 'data-rebroadcast': r.id, title: 'إعادة البث' },
                },
                [Ui.ic('fa-solid fa-tower-broadcast'), 'إعادة البث']
              )
            );
          }
          wrap.appendChild(
            Ui.el('button', { class: 'btn btn-ghost btn-sm', attrs: { 'data-view': r.id } }, [
              Ui.ic('fa-regular fa-eye'),
              'تفاصيل',
            ])
          );
          return wrap;
        }
        const statusFilterEl = document.getElementById('filter-status');
        STATUS_ORDER.forEach((s) =>
          statusFilterEl.appendChild(
            Ui.el('option', { text: Ui.statusLabel(s), attrs: { value: s } })
          )
        );

        const specialtyFilterEl = document.getElementById('filter-specialty');
        loadSpecialties(specialtyFilterEl, { placeholder: 'كل التخصصات' });

        // The amount confirmation is its own state machine, so it gets its own filter
        // rather than being folded into the request-status one: "completed but
        // disputed" and "completed and settled" are the same request status.
        const amountFilterEl = document.getElementById('filter-amount-status');

        // Deep-link support: /admin/requests?amount=disputed&status=completed.
        // The wallets page's "مدفوعات معلقة" tab links straight here so an admin who
        // clicked a row lands on that row, filtered, instead of an unfiltered list of
        // every request. A value that is not one of the select's own options is
        // ignored rather than leaving the select on a blank value.
        const params = new URLSearchParams(window.location.search);
        ['amount', 'status'].forEach((key) => {
          const el = key === 'amount' ? amountFilterEl : statusFilterEl;
          const wanted = params.get(key);
          if (wanted && el.querySelector('option[value="' + CSS.escape(wanted) + '"]')) {
            el.value = wanted;
          }
        });

        let all = [];
        let page = 1;
        const SIZE = 8;
        let techNames = {};
        const allTechnicians = [];

        function techMap() {
          return techNames;
        }

        function filtered() {
          const st = statusFilterEl.value;
          const spec = specialtyFilterEl.value;
          const amount = amountFilterEl.value;
          const from = document.getElementById('from-date').value;
          const to = document.getElementById('to-date').value;
          return all.filter((r) => {
            if (st && r.status !== st) return false;
            if (spec && r.specialty !== spec) return false;
            if (amount && r.amount_status !== amount) return false;
            if (from || to) {
              const day = (r.created_at || '').slice(0, 10);
              if (from && day < from) return false;
              if (to && day > to) return false;
            }
            return true;
          });
        }

        function render() {
          const rows = filtered();
          document.getElementById('total-count').textContent = rows.length;
          const pages = Math.max(1, Math.ceil(rows.length / SIZE));
          if (page > pages) page = pages;
          const start = (page - 1) * SIZE;
          const slice = rows.slice(start, start + SIZE);
          document.getElementById('page-info').textContent =
            (rows.length ? start + 1 : 0) + '–' + (start + slice.length) + ' من ' + rows.length;

          const tbody = document.getElementById('tbody');
          Ui.clear(tbody);
          if (!rows.length) {
            tbody.appendChild(
              Ui.el('tr', {}, [Ui.el('td', { attrs: { colspan: 8 } }, ['لا توجد طلبات مطابقة'])])
            );
            Ui.clear(document.getElementById('pager'));
            return;
          }
          slice.forEach((r) => {
            const m = Ui.meta(r.specialty);
            tbody.appendChild(
              Ui.el('tr', {}, [
                Ui.el('td', {}, ['#' + r.id]),
                Ui.el('td', {}, [
                  Ui.el('div', { class: 'tbl-user' }, [
                    Ui.el(
                      'span',
                      {
                        class: 'avatar',
                        attrs: { style: 'width:30px;height:30px;font-size:0.7rem' },
                      },
                      [Ui.initials(r.customer_name)]
                    ),
                    Ui.escapeHtml(r.customer_name),
                  ]),
                ]),
                Ui.el('td', {}, [
                  Ui.el(
                    'span',
                    {
                      class: 'badge',
                      attrs: { style: 'background:' + m.bg + ';color:' + m.color },
                    },
                    [Ui.ic(m.icon), m.label]
                  ),
                  r.specialty === 'other' && r.custom_specialty_text
                    ? Ui.el(
                        'span',
                        {
                          style:
                            'display:block;margin-top:4px;font-size:0.82rem;color:var(--adm-body)',
                        },
                        [Ui.escapeHtml(r.custom_specialty_text)]
                      )
                    : null,
                ]),
                Ui.el('td', {}, [
                  Ui.statusBadge(r.status),
                  // A queued request is pending AND waiting, which the status badge
                  // cannot express; without this the admin queue endpoint would be
                  // listing requests that look identical to ordinary pending ones.
                  r.is_queued && r.status === 'pending'
                    ? Ui.el(
                        'div',
                        { class: 'adm-badge yellow', attrs: { style: 'margin-top:5px' } },
                        [Ui.ic('fa-solid fa-clock'), ' في قائمة الانتظار']
                      )
                    : null,
                ]),
                // Null for a request that never entered the cash confirmation (still
                // running, or settled the old way), so the cell is simply empty.
                Ui.el('td', {}, [Ui.amountStatusBadge(r.amount_status)]),
                Ui.el('td', {}, [
                  r.technician_name
                    ? Ui.escapeHtml(r.technician_name)
                    : Ui.el('span', { class: 'muted' }, ['—']),
                ]),
                Ui.el('td', {}, [Ui.dateTime(r.created_at)]),
                Ui.el('td', {}, [rowActions(r)]),
              ])
            );
          });
          Ui.paginate(document.getElementById('pager'), rows.length, page, SIZE, (p) => {
            page = p;
            render();
          });
        }

        async function load() {
          const tbody = document.getElementById('tbody');
          Ui.clear(tbody);
          tbody.appendChild(Ui.skeletonTable(6, 8));
          try {
            const data = await api('/api/admin/requests');
            all = data.requests || [];
            try {
              const t = await api('/api/admin/technicians');
              techNames = {};
              (t.technicians || []).forEach((x) => {
                techNames[x.id] = x.name;
              });
              allTechnicians.length = 0;
              Array.prototype.push.apply(allTechnicians, t.technicians || []);
            } catch (e) {
              /* name fallback */
            }
            render();
          } catch (e) {
            toast(e.message, 'error');
          }
        }

        statusFilterEl.addEventListener('change', () => {
          page = 1;
          render();
        });
        specialtyFilterEl.addEventListener('change', () => {
          page = 1;
          render();
        });
        amountFilterEl.addEventListener('change', () => {
          page = 1;
          render();
        });
        document.getElementById('from-date').addEventListener('change', () => {
          page = 1;
          render();
        });
        document.getElementById('to-date').addEventListener('change', () => {
          page = 1;
          render();
        });
        document.getElementById('reset-filters').addEventListener('click', () => {
          statusFilterEl.value = '';
          specialtyFilterEl.value = '';
          amountFilterEl.value = '';
          document.getElementById('from-date').value = '';
          document.getElementById('to-date').value = '';
          page = 1;
          render();
        });
        document.getElementById('refresh-btn').addEventListener('click', load);

        document.getElementById('tbody').addEventListener('click', async (e) => {
          const btn = e.target.closest('[data-view],[data-rebroadcast]');
          if (!btn) return;

          // Re-broadcast first: this request's row also carries a view button, and
          // the row has to be refetched afterwards because the status changes from
          // 'no_technician' to 'pending'.
          if (btn.hasAttribute('data-rebroadcast')) {
            if (!confirm('إعادة بث هذا الطلب إلى الفنيين المتاحين؟')) return;
            btn.disabled = true;
            Ui.btnLoading(btn, 'جارٍ البث…');
            try {
              const d = await api(
                '/api/admin/requests/' + btn.dataset.rebroadcast + '/rebroadcast',
                { method: 'POST' }
              );
              toast(d.message, d.sent_to > 0 ? 'success' : 'warn');
              load();
            } catch (err) {
              toast(err.message, 'error');
              Ui.btnReset(btn);
            }
            return;
          }

          const r = all.find((x) => x.id === Number(btn.dataset.view));
          if (!r) return;
          openDetail(r);
        });

        function openDetail(r) {
          const m = Ui.meta(r.specialty);
          const rows = Ui.el('div', { class: 'detail-grid' });
          const add = (k, v) =>
            rows.appendChild(
              Ui.el('div', { class: 'detail-row' }, [
                Ui.el('span', { class: 'dk' }, [k]),
                Ui.el('span', { class: 'dv' }, [v]),
              ])
            );
          add('رقم الطلب', '#' + r.id);
          add(
            'الخدمة',
            Ui.el(
              'span',
              { class: 'badge', attrs: { style: 'background:' + m.bg + ';color:' + m.color } },
              [Ui.ic(m.icon), m.label]
            )
          );
          if (r.custom_specialty_text)
            add('الخدمة المطلوبة (مخصصة)', Ui.escapeHtml(r.custom_specialty_text));
          add('الحالة', Ui.statusBadge(r.status));
          const custWrap = Ui.el('span', {}, [Ui.escapeHtml(r.customer_name)]);
          if (r.customer_phone)
            custWrap.appendChild(
              Ui.el(
                'a',
                {
                  class: 'dv-tel',
                  attrs: {
                    href: 'tel:' + r.customer_phone,
                    dir: 'ltr',
                    style: 'margin-inline-start:8px',
                  },
                },
                [r.customer_phone]
              )
            );
          add('العميل', custWrap);
          add('موقع العميل', Ui.escapeHtml(r.location_text || r.customer_location || '—'));
          add(
            'الفني المسند',
            r.technician_name
              ? Ui.escapeHtml(r.technician_name) +
                  (r.technician_phone ? ' (جهة ' + r.technician_phone + ')' : '')
              : Ui.el('span', { class: 'muted' }, ['لا يوجد بعد'])
          );
          if (r.description) add('الوصف', Ui.el('div', {}, [Ui.escapeHtml(r.description)]));
          add('أُنشئ', Ui.dateTime(r.created_at));
          if (r.assigned_at) add('أُسند في', Ui.dateTime(r.assigned_at));
          if (r.completed_at) add('أُنجز في', Ui.dateTime(r.completed_at));

          const body = Ui.el('div', {});
          body.appendChild(rows);

          // The two-sided cash confirmation, with both figures side by side. An admin
          // resolving a dispute is deciding which of two numbers to believe, so the
          // whole section is meaningless unless both are on screen at once.
          if (r.amount_status) {
            const amtRows = Ui.el('div', { class: 'detail-grid' });
            const addAmt = (k, v) =>
              amtRows.appendChild(
                Ui.el('div', { class: 'detail-row' }, [
                  Ui.el('span', { class: 'dk' }, [k]),
                  Ui.el('span', { class: 'dv' }, [v]),
                ])
              );
            addAmt('حالة المبلغ', Ui.amountStatusBadge(r.amount_status));
            addAmt(
              'ما سجّله الفني',
              r.technician_reported_amount != null
                ? money(r.technician_reported_amount)
                : Ui.el('span', { class: 'muted' }, ['—'])
            );
            addAmt(
              'ما أكّده العميل',
              r.customer_reported_amount != null
                ? money(r.customer_reported_amount)
                : Ui.el('span', { class: 'muted' }, ['لم يرد بعد'])
            );
            if (r.final_amount != null)
              addAmt('المبلغ المعتمد', Ui.el('b', {}, [money(r.final_amount)]));
            // Neutral wording: the endpoint also records these for an admin
            // confirming a pending payment the customer never answered, so
            // "ملاحظة الحل" would imply a dispute happened when there wasn't one.
            if (r.dispute_note) addAmt('ملاحظة الإدارة', Ui.escapeHtml(r.dispute_note));
            if (r.dispute_resolved_at)
              addAmt('حُسم بواسطة الإدارة في', Ui.dateTime(r.dispute_resolved_at));

            body.appendChild(
              Ui.el('h3', { style: 'margin:20px 0 10px;font-size:0.95rem' }, [
                Ui.ic('fa-solid fa-money-bill-transfer'),
                ' تأكيد المبلغ',
              ])
            );
            body.appendChild(amtRows);

            // Only a disputed request is actionable: anything else is already settled
            // or still waiting on somebody, and the endpoint would refuse it anyway.
            if (r.amount_status === 'disputed') {
              const box = Ui.el('div', { class: 'assign-box', style: 'margin-top:18px' });
              box.appendChild(
                Ui.el('h4', {}, [Ui.ic('fa-solid fa-triangle-exclamation'), 'حل النزاع'])
              );
              box.appendChild(
                Ui.el('div', { class: 'form-hint', style: 'margin-bottom:12px' }, [
                  'الفني والعميل سجّلا مبالغ مختلفة. اكتب المبلغ المعتمد — عمولة المنصة هتتحسب منه.',
                ])
              );
              box.appendChild(
                Ui.el(
                  'button',
                  {
                    class: 'btn btn-soft-brand btn-sm',
                    attrs: { type: 'button', 'data-resolve-dispute': r.id },
                  },
                  [Ui.ic('fa-solid fa-gavel'), 'حل النزاع الآن']
                )
              );
              body.appendChild(box);
            }
          }

          const declined = parseDeclined(r);
          if (declined.length) {
            body.appendChild(
              Ui.el('h3', { style: 'margin:20px 0 10px;font-size:0.95rem' }, [
                'وُجّه الطلب أيضاً إلى:',
              ])
            );
            declined.forEach((id) => {
              const name = techNames[id] || 'فني #' + id;
              body.appendChild(
                Ui.el('div', { class: 'history-chip' }, [
                  Ui.ic('fa-solid fa-user-xmark'),
                  ' ' + Ui.escapeHtml(name) + ' — رفض أو انتهى وقت القبول',
                ])
              );
            });
          } else {
            body.appendChild(
              Ui.el('div', { class: 'form-hint', style: 'margin-top:14px' }, [
                'لا يوجد تاريخ رفض لهذا الطلب.',
              ])
            );
          }

          const actions = Ui.el('div', {
            style: 'display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;width:100%',
          });
          actions.appendChild(
            Ui.el(
              'button',
              { class: 'btn btn-soft', attrs: { type: 'button', onclick: 'closeModal()' } },
              ['إغلاق']
            )
          );

          if (r.status === 'pending') {
            const assignBox = Ui.el('div', { class: 'assign-box', style: 'margin-top:18px' });
            body.appendChild(assignBox);
            buildAssign(assignBox, r);
          } else if (r.status === 'assigned' || r.status === 'in_progress') {
            actions.appendChild(
              Ui.el(
                'button',
                {
                  class: 'btn btn-soft-warn btn-sm',
                  attrs: { type: 'button', 'data-unassign': r.id },
                },
                [Ui.ic('fa-solid fa-user-slash'), 'إلغاء التعيين']
              )
            );
          } else if (r.status === 'no_technician') {
            // Same offer as the row button, reachable from the details modal where
            // an admin actually reads why a request stalled.
            body.appendChild(
              Ui.el('div', { class: 'assign-box', style: 'margin-top:18px' }, [
                Ui.el('h4', {}, [Ui.ic('fa-solid fa-triangle-exclamation'), 'مفيش فني قبل الطلب']),
                Ui.el('div', { class: 'form-hint', style: 'margin-bottom:12px' }, [
                  'الطلب اتقفل لأن مفيش فني متاح في التخصص ده قبل انتهاء مهلة العرض. جرّب إعادة البث لو فنيين جدد اتسجلوا.',
                ]),
                Ui.el(
                  'button',
                  {
                    class: 'btn btn-soft-brand btn-sm',
                    attrs: { type: 'button', 'data-rebroadcast': r.id },
                  },
                  [Ui.ic('fa-solid fa-tower-broadcast'), 'إعادة البث الآن']
                ),
              ])
            );
          }
          if (r.status !== 'completed' && r.status !== 'cancelled') {
            actions.appendChild(
              Ui.el(
                'button',
                {
                  class: 'btn btn-soft-warn btn-sm',
                  attrs: { type: 'button', 'data-cancel': r.id },
                },
                [Ui.ic('fa-solid fa-ban'), 'إلغاء الطلب']
              )
            );
          }
          actions.appendChild(
            Ui.el(
              'button',
              {
                class: 'btn btn-soft-danger btn-sm',
                attrs: { type: 'button', 'data-reqdel': r.id },
              },
              [Ui.ic('fa-solid fa-trash'), 'حذف']
            )
          );

          Ui.openModal('تفاصيل الطلب #' + r.id, body, actions);
          bindRequestActions(r);
        }

        function matchingTechnicians(r) {
          return allTechnicians.filter(
            (t) => t.specialty === r.specialty && t.availability === 'available'
          );
        }

        function buildAssign(box, r) {
          Ui.clear(box);
          box.appendChild(Ui.el('h4', {}, [Ui.ic('fa-solid fa-user-plus'), 'تعيين فني']));
          const cands = matchingTechnicians(r);
          if (!cands.length) {
            box.appendChild(
              Ui.el('div', { class: 'form-hint' }, ['لا يوجد فنيون متاحون في هذا التخصص حالياً.'])
            );
            return;
          }
          const row = Ui.el('div', { class: 'assign-row' });
          const sel = Ui.el('select', { class: 'input', id: 'assign-select' });
          cands.forEach((t) =>
            sel.appendChild(
              Ui.el('option', { text: t.name + ' — ' + t.phone, attrs: { value: t.id } })
            )
          );
          const btn = Ui.el('button', { class: 'btn btn-brand btn-sm', id: 'assign-btn' }, [
            'تأكيد التعيين',
          ]);
          btn.addEventListener('click', async () => {
            Ui.btnLoading(btn, 'جارٍ التعيين…');
            try {
              const data = await api('/api/admin/requests/' + r.id + '/assign', {
                method: 'POST',
                body: { technician_id: Number(sel.value) },
              });
              toast(data.message, 'success');
              Ui.openModal(null, null, null, { onClose: null });
              load();
            } catch (err) {
              toast(err.message, 'error');
              Ui.btnReset(btn);
            }
          });
          row.appendChild(sel);
          row.appendChild(btn);
          box.appendChild(row);
        }

        // Dispute resolution. Replaces the details sheet rather than stacking on it:
        // Ui.openModal closes whatever is open, and only one overlay is supported.
        // The two figures the decision is made against are repeated inside this sheet
        // for exactly that reason — the admin must not have to remember them.
        //
        // The final amount is NOT prefilled to either party's number. Suggesting one
        // would make "resolve" a rubber stamp on whoever the admin reads first, and
        // the two are exactly the thing in dispute.
        function openResolveDispute(r, trigger) {
          const amountInput = Ui.el('input', {
            class: 'input',
            attrs: {
              id: 'dispute-final-amount',
              type: 'number',
              min: '0.01',
              step: '0.01',
              inputmode: 'decimal',
              placeholder: 'مثال: 200',
              dir: 'ltr',
            },
          });
          const noteInput = Ui.el('textarea', {
            class: 'input',
            attrs: {
              id: 'dispute-note',
              rows: '2',
              maxlength: '300',
              placeholder: 'إزاي حسمت النزاع؟',
            },
          });

          const body = Ui.el('div', {}, [
            Ui.el('div', { class: 'detail-grid', style: 'margin-bottom:16px' }, [
              Ui.el('div', { class: 'detail-row' }, [
                Ui.el('span', { class: 'dk' }, ['سجّله الفني']),
                Ui.el('span', { class: 'dv' }, [money(r.technician_reported_amount)]),
              ]),
              Ui.el('div', { class: 'detail-row' }, [
                Ui.el('span', { class: 'dk' }, ['أكّده العميل']),
                Ui.el('span', { class: 'dv' }, [money(r.customer_reported_amount)]),
              ]),
            ]),
            Ui.el('div', { class: 'form-group' }, [
              Ui.el('label', { class: 'form-label', attrs: { for: 'dispute-final-amount' } }, [
                'المبلغ المعتمد (ج.م) ',
                Ui.el('span', { style: 'color:var(--danger-500)' }, ['*']),
              ]),
              amountInput,
              Ui.el('div', { class: 'form-hint' }, ['عمولة المنصة 20% هتتحسب من المبلغ ده']),
            ]),
            Ui.el('div', { class: 'form-group' }, [
              Ui.el('label', { class: 'form-label', attrs: { for: 'dispute-note' } }, [
                'ملاحظة (اختياري)',
              ]),
              noteInput,
            ]),
          ]);

          const confirmBtn = Ui.el(
            'button',
            {
              class: 'btn btn-brand',
              on: {
                click: async () => {
                  const amt = Number(amountInput.value);
                  if (!isFinite(amt) || amt <= 0) {
                    toast('اكتب المبلغ المعتمد', 'error');
                    amountInput.focus();
                    return;
                  }
                  Ui.btnLoading(confirmBtn, 'جارٍ الحسم...');
                  try {
                    const d = await api('/api/admin/payments/' + r.id + '/resolve-dispute', {
                      method: 'POST',
                      body: { final_amount: amt, note: noteInput.value.trim() || undefined },
                    });
                    toast('تم حل النزاع — المبلغ المعتمد ' + money(d.final_amount), 'success');
                    Ui.openModal(null, null, null, { onClose: null });
                    load();
                  } catch (err) {
                    toast(err.message, 'error');
                    Ui.btnReset(confirmBtn);
                  }
                },
              },
            },
            [Ui.ic('fa-solid fa-gavel'), 'تأكيد الحل']
          );

          const actions = Ui.el(
            'div',
            { style: 'display:flex;gap:8px;justify-content:flex-end;width:100%' },
            [
              Ui.el(
                'button',
                { class: 'btn btn-soft', attrs: { type: 'button', onclick: 'closeModal()' } },
                ['إلغاء']
              ),
              confirmBtn,
            ]
          );

          Ui.openModal('حل نزاع المبلغ — طلب #' + r.id, body, actions, {
            onOpen: () => requestAnimationFrame(() => amountInput.focus()),
          });
          if (trigger) trigger.disabled = false;
        }

        function bindRequestActions(r) {
          const unassign = document.querySelector('.modal [data-unassign]');
          const cancel = document.querySelector('.modal [data-cancel]');
          const del = document.querySelector('.modal [data-reqdel]');
          const rebroadcast = document.querySelector('.modal [data-rebroadcast]');
          const resolveBtn = document.querySelector('.modal [data-resolve-dispute]');
          if (resolveBtn) {
            resolveBtn.addEventListener('click', () => {
              openResolveDispute(r, resolveBtn);
            });
          }
          if (rebroadcast) {
            rebroadcast.addEventListener('click', async () => {
              if (!confirm('إعادة بث هذا الطلب إلى الفنيين المتاحين؟')) return;
              Ui.btnLoading(rebroadcast, 'جارٍ البث…');
              try {
                const data = await api('/api/admin/requests/' + r.id + '/rebroadcast', {
                  method: 'POST',
                });
                toast(data.message, data.sent_to > 0 ? 'success' : 'warn');
                Ui.openModal(null, null, null, { onClose: null });
                load();
              } catch (err) {
                toast(err.message, 'error');
                Ui.btnReset(rebroadcast);
              }
            });
          }
          if (unassign) {
            unassign.addEventListener('click', async () => {
              if (!confirm('إلغاء تعيين الفني وإعادة الطلب للانتظار؟')) return;
              Ui.btnLoading(unassign, '');
              try {
                const data = await api('/api/admin/requests/' + r.id + '/unassign', {
                  method: 'POST',
                });
                toast(data.message, 'success');
                Ui.openModal(null, null, null, { onClose: null });
                load();
              } catch (err) {
                toast(err.message, 'error');
                Ui.btnReset(unassign);
              }
            });
          }
          if (cancel) {
            cancel.addEventListener('click', async () => {
              if (!confirm('إلغاء هذا الطلب نهائياً؟')) return;
              Ui.btnLoading(cancel, '');
              try {
                const data = await api('/api/admin/requests/' + r.id + '/cancel', {
                  method: 'POST',
                });
                toast(data.message, 'success');
                Ui.openModal(null, null, null, { onClose: null });
                load();
              } catch (err) {
                toast(err.message, 'error');
                Ui.btnReset(cancel);
              }
            });
          }
          if (del) {
            del.addEventListener('click', async () => {
              if (!confirm('حذف الطلب #' + r.id + ' نهائياً؟ لا يمكن التراجع.')) return;
              Ui.btnLoading(del, '');
              try {
                const data = await api('/api/admin/requests/' + r.id, { method: 'DELETE' });
                toast(data.message, 'success');
                Ui.openModal(null, null, null, { onClose: null });
                load();
              } catch (err) {
                toast(err.message, 'error');
                Ui.btnReset(del);
              }
            });
          }
        }

        function parseDeclined(r) {
          let arr = [];
          try {
            if (typeof r.declined_technicians === 'string')
              arr = JSON.parse(r.declined_technicians || '[]');
            else if (Array.isArray(r.declined_technicians)) arr = r.declined_technicians;
          } catch (e) {
            arr = [];
          }
          return arr.filter((x) => x && typeof x === 'number');
        }

        window.closeModal = () => Ui.openModal(null, null, null, { onClose: null });

        load();
      })();
    </script>
  </body>
</html>
