<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/dashawy-brand/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/dashawy-brand/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/dashawy-brand/apple-touch-icon.png">
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>نسيت كلمة السر — دشاوي</title>
    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="دشاوي" />
    <!-- iOS splash screen (universal fallback) -->
    <link rel="apple-touch-startup-image" href="/dashawy-brand/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body
    style="
      background: linear-gradient(160deg, #f8fafc 0%, #eef2ff 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    "
  >
    <div style="max-width: 480px; width: 100%">
      <div style="text-align: center; margin-bottom: 24px">
        <div
          style="
            display: inline-grid;
            place-items: center;
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #4f46e5, #a855f7);
            color: #fff;
            font-size: 1.6rem;
            box-shadow: 0 16px 40px -10px rgba(79, 70, 229, 0.5);
            margin-bottom: 14px;
          "
        >
          <i class="fa-solid fa-envelope"></i>
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 8px">
          استرجاع كلمة السر
        </h1>
        <p style="color: #64748b; font-size: 0.9rem; line-height: 1.7">
          اكتب بريدك الإلكتروني وهنبعتلك كود من 6 أرقام تدخل بيه مباشرة،
          من غير ما تحتاج كلمة السر.
        </p>
      </div>

      <div class="card" style="padding: 26px">
        <form id="otp-request-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="otp-email">البريد الإلكتروني</label>
            <input
              type="email"
              id="otp-email"
              class="input"
              placeholder="you@example.com"
              autocomplete="email"
              dir="ltr"
              style="text-align: right"
            />
          </div>

          <button
            type="submit"
            class="btn btn-brand btn-block btn-lg"
            id="submit-btn"
            style="margin-top: 8px"
          >
            <i class="fa-solid fa-paper-plane"></i> إرسال الكود
          </button>
        </form>

        <div
          style="
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
          "
        >
          <a
            href="/login.html"
            style="
              background: none;
              border: none;
              color: #64748b;
              font-size: 0.82rem;
              cursor: pointer;
              font-family: inherit;
              text-decoration: none;
            "
          >
            <i class="fa-solid fa-arrow-right"></i> رجوع لتسجيل الدخول
          </a>
        </div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
      // Public page by design: it is the way back in for someone who cannot log
      // in. The server answers request-otp identically for a registered and an
      // unknown address, so nothing here can be used to discover who has an
      // account — which is exactly why the page below must not ask the visitor
      // to confirm that the address exists either.
      const form = document.getElementById('otp-request-form');
      const btn = document.getElementById('submit-btn');
      const emailEl = document.getElementById('otp-email');

      // A second visit with the address already in the URL (a back navigation
      // from the code page) prefills it, so the user does not retype it.
      const prefilled = new URLSearchParams(window.location.search).get('email');
      if (prefilled) emailEl.value = prefilled;

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearFormErrors(document);

        const email = emailEl.value.trim();
        if (!email) {
          setFieldError(emailEl, 'اكتب بريدك الإلكتروني');
          return;
        }

        Ui.btnLoading(btn, 'جارٍ الإرسال…');
        try {
          // The message is deliberately not checked: the server sends back the
          // same one whether or not the address is registered, and branching on
          // it here would turn this page into the enumeration oracle the backend
          // goes to such lengths to avoid.
          await api('/api/auth/request-otp', { method: 'POST', body: { email } });

          toast('تم إرسال الكود إلى بريدك الإلكتروني', 'success');
          setTimeout(function () {
            window.location.href = '/verify-otp.html?email=' + encodeURIComponent(email);
          }, 600);
        } catch (err) {
          toast(err.message, 'error');
          Ui.btnReset(btn);
        }
      });

      emailEl.focus();
    </script>
    <script src="/js/pwa-install.js"></script>
  </body>
</html>
