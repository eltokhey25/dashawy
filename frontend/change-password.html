<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/dashawy-brand/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/dashawy-brand/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/dashawy-brand/apple-touch-icon.png">
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>تغيير كلمة المرور — دشاوي</title>
    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="دشاوي" />
    <!-- iOS splash screen (universal fallback) -->
    <link rel="apple-touch-startup-image" href="/dashawy-brand/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body
    style="
      background: linear-gradient(160deg, #f8fafc 0%, #eef2ff 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    "
  >
    <div style="max-width: 480px; width: 100%">
      <div style="text-align: center; margin-bottom: 24px">
        <div
          style="
            display: inline-grid;
            place-items: center;
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #4f46e5, #a855f7);
            color: #fff;
            font-size: 1.6rem;
            box-shadow: 0 16px 40px -10px rgba(79, 70, 229, 0.5);
            margin-bottom: 14px;
          "
        >
          <i class="fa-solid fa-lock"></i>
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 8px">
          تغيير كلمة المرور
        </h1>
        <p id="cp-intro" style="color: #64748b; font-size: 0.9rem; line-height: 1.7">
          اختار كلمة مرور جديدة خاصة بك عشان تحمي حسابك.
        </p>
      </div>

      <div class="card" style="padding: 26px">
        <form id="change-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="current-pwd" id="current-pwd-label"
              >كلمة المرور الحالية</label
            >
            <input
              type="password"
              id="current-pwd"
              class="input"
              placeholder="••••••••"
              autocomplete="current-password"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="new-pwd">كلمة المرور الجديدة</label>
            <input
              type="password"
              id="new-pwd"
              class="input"
              placeholder="8 أحرف على الأقل، فيها حرف ورقم"
              autocomplete="new-password"
            />
            <div class="form-hint">8 أحرف على الأقل، مع حرف واحد ورقم واحد على الأقل</div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm-pwd">تأكيد كلمة المرور الجديدة</label>
            <input
              type="password"
              id="confirm-pwd"
              class="input"
              placeholder="••••••••"
              autocomplete="new-password"
            />
          </div>

          <button
            type="submit"
            class="btn btn-brand btn-block btn-lg"
            id="submit-btn"
            style="margin-top: 8px"
          >
            <i class="fa-solid fa-check"></i> حفظ كلمة المرور الجديدة
          </button>
        </form>

        <div
          style="
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
          "
        >
          <!-- Only offered on a voluntary change. When an admin reset the password
             the user is FORCED here, and "back" would be a dead end. -->
          <button
            type="button"
            id="cancel-btn"
            style="
              background: none;
              border: none;
              color: #64748b;
              font-size: 0.82rem;
              cursor: pointer;
              font-family: inherit;
            "
          >
            <i class="fa-solid fa-arrow-right"></i> رجوع
          </button>
          <button
            type="button"
            id="logout-btn"
            style="
              background: none;
              border: none;
              color: #94a3b8;
              font-size: 0.82rem;
              cursor: pointer;
              font-family: inherit;
            "
          >
            <i class="fa-solid fa-arrow-right-from-bracket"></i> تسجيل الخروج
          </button>
        </div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
      // Must be logged in
      if (!Auth.isAuthed()) {
        window.location.replace('/login.html');
        throw new Error('redirect');
      }

      const form = document.getElementById('change-form');
      const btn = document.getElementById('submit-btn');
      const currentEl = document.getElementById('current-pwd');
      const newEl = document.getElementById('new-pwd');
      const confirmEl = document.getElementById('confirm-pwd');

      // This page serves two audiences. When an admin reset the password the user
      // is forced here (auth.js / login.html redirect), the wording is "pick a new
      // one" and there is no way back. Arriving from the avatar dropdown or the
      // profile page it is an ordinary settings change, so the copy and the
      // available actions both change. Guessing wrong here would tell a customer
      // who only wanted to rotate their password that the admin had reset it.
      var user = Auth.getUser();
      var forced = Boolean(user && user.must_change_password);
      var MIN_LENGTH = 8;

      if (forced) {
        document.getElementById('cp-intro').innerHTML =
          'الإدارة قامت بإعادة تعيين كلمة المرور الخاصة بك.<br>' +
          'من فضلك اختر كلمة مرور جديدة خاصة بك لتأمين حسابك.';
        document.getElementById('current-pwd-label').textContent =
          'كلمة المرور المؤقتة (التي استخدمتها الآن)';
        currentEl.placeholder = '••••••••';
        document.getElementById('cancel-btn').style.display = 'none';
      }

      /**
       * Marks a field invalid and shows its message, WITHOUT clearing the others.
       *
       * The shared setFieldError() calls clearFormErrors() first on purpose (one
       * message at a time on a long form). This page validates three
       * interdependent fields at once, so calling it in a loop makes each call
       * wipe the previous message — an entirely empty submit would then show only
       * the last complaint, "the two passwords don't match", on a form nobody
       * filled in.
       *
       * @param {HTMLInputElement} input
       * @param {string} message
       * @returns {void}
       */
      function markError(input, message) {
        input.classList.add('invalid');
        var wrap = input.closest('.form-group') || input.parentElement;
        wrap.appendChild(
          Ui.el('div', { class: 'form-error' }, [Ui.ic('fa-solid fa-circle-exclamation'), message])
        );
      }

      /**
       * Mirrors the server's policy so the form never submits something the API is
       * guaranteed to reject. The server remains the authority; this only saves a
       * round trip and explains which rule was broken.
       *
       * @param {string} value
       * @returns {string|null} Arabic error, or null when acceptable.
       */
      function passwordProblem(value) {
        if (typeof value !== 'string' || value.length === 0) return 'كلمة المرور الجديدة مطلوبة';
        if (value.length < MIN_LENGTH) return 'كلمة المرور يجب ألا تقل عن ' + MIN_LENGTH + ' أحرف';
        if (!/[a-zA-Z]/.test(value)) return 'كلمة المرور يجب أن تحتوي على حرف واحد على الأقل';
        if (!/\d/.test(value)) return 'كلمة المرور يجب أن تحتوي على رقم واحد على الأقل';
        return null;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearFormErrors(document);
        [currentEl, newEl, confirmEl].forEach(function (el) {
          el.classList.remove('invalid');
        });

        const current = currentEl.value;
        const newPwd = newEl.value;
        const confirm = confirmEl.value;

        let ok = true;
        if (!current) {
          markError(
            currentEl,
            forced ? 'كلمة المرور المؤقتة مطلوبة' : 'كلمة المرور الحالية مطلوبة'
          );
          ok = false;
        }
        const problem = passwordProblem(newPwd);
        if (problem) {
          markError(newEl, problem);
          ok = false;
        } else if (newPwd === current) {
          markError(newEl, 'يجب أن تختلف عن الحالية');
          ok = false;
        }
        if (newPwd !== confirm) {
          markError(confirmEl, 'كلمتا المرور غير متطابقتين');
          ok = false;
        }
        if (!ok) return;

        Ui.btnLoading(btn, 'جارٍ الحفظ…');

        try {
          await api('/api/auth/change-password', {
            method: 'POST',
            body: { current_password: current, new_password: newPwd },
          });
          toast('تم تغيير كلمة المرور بنجاح ✅', 'success');

          // Clear the flag from the stored session. auth.js force-redirects to this
          // page whenever must_change_password is set, so leaving it behind would
          // trap the user in a redirect loop after the successful change.
          if (user) {
            localStorage.setItem(
              'fr_user',
              JSON.stringify({ ...user, must_change_password: false })
            );
          }

          // Auth.homePath() resolves the right home per role (customer /
          // technician / admin), so one redirect covers everyone.
          setTimeout(function () {
            window.location.href = Auth.homePath();
          }, 1000);
        } catch (err) {
          toast(err.message, 'error');
          Ui.btnReset(btn);
          // Clear the two NEW fields and keep the current one: the user can retry
          // without retyping it, and nothing secret is left on screen that they
          // did not just type. The server is what actually rejected the attempt.
          newEl.value = '';
          confirmEl.value = '';
          newEl.focus();
        }
      });

      document.getElementById('cancel-btn').addEventListener('click', function () {
        // Back where the user came from, falling back to their home page when this
        // was opened directly (no referrer, or a fresh tab).
        if (document.referrer && document.referrer.indexOf(window.location.origin) === 0) {
          window.history.back();
        } else {
          window.location.href = Auth.homePath();
        }
      });

      document.getElementById('logout-btn').addEventListener('click', () => {
        if (forced) {
          if (
            confirm(
              'تسجيل الخروج بدون تغيير كلمة المرور؟ لن تستطيع الدخول مرة أخرى حتى تتصل بالإدارة.'
            )
          ) {
            Auth.logout();
          }
          return;
        }
        Auth.logout();
      });
    </script>
    <script src="/js/pwa-install.js"></script>
  </body>
</html>
