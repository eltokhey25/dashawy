<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/dashawy-brand/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/dashawy-brand/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/dashawy-brand/apple-touch-icon.png">
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>كود الدخول — دشاوي</title>
    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="دشاوي" />
    <!-- iOS splash screen (universal fallback) -->
    <link rel="apple-touch-startup-image" href="/dashawy-brand/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body
    style="
      background: linear-gradient(160deg, #f8fafc 0%, #eef2ff 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    "
  >
    <div style="max-width: 480px; width: 100%">
      <div style="text-align: center; margin-bottom: 24px">
        <div
          style="
            display: inline-grid;
            place-items: center;
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, #4f46e5, #a855f7);
            color: #fff;
            font-size: 1.6rem;
            box-shadow: 0 16px 40px -10px rgba(79, 70, 229, 0.5);
            margin-bottom: 14px;
          "
        >
          <i class="fa-solid fa-key"></i>
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 8px">
          اكتب كود الدخول
        </h1>
        <p style="color: #64748b; font-size: 0.9rem; line-height: 1.7">
          بعثنا كود من 6 أرقام إلى<br /><b id="otp-email-label" dir="ltr"></b><br />
          الكود صالح لمدة 10 دقائق.
        </p>
      </div>

      <div class="card" style="padding: 26px">
        <form id="verify-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="otp-code">كود الدخول</label>
            <input
              type="text"
              id="otp-code"
              class="input"
              placeholder="000000"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="6"
              pattern="\d{6}"
              dir="ltr"
              style="
                text-align: center;
                letter-spacing: 0.5em;
                font-size: 1.4rem;
                font-weight: 700;
                padding: 14px 10px;
              "
            />
          </div>

          <button
            type="submit"
            class="btn btn-brand btn-block btn-lg"
            id="submit-btn"
            style="margin-top: 8px"
          >
            <i class="fa-solid fa-right-to-bracket"></i> دخول
          </button>
        </form>

        <div
          style="
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
          "
        >
          <!-- Resend re-opens the request page with the address already filled
               in, so the user does not type it a second time. The server enforces
               one code a minute; pressing this too early says so. -->
          <a
            id="resend-link"
            href="/forgot-password.html"
            style="
              background: none;
              border: none;
              color: #64748b;
              font-size: 0.82rem;
              cursor: pointer;
              font-family: inherit;
              text-decoration: none;
            "
          >
            <i class="fa-solid fa-rotate"></i> إعادة إرسال الكود
          </a>
          <a
            href="/login.html"
            style="
              background: none;
              border: none;
              color: #94a3b8;
              font-size: 0.82rem;
              cursor: pointer;
              font-family: inherit;
              text-decoration: none;
            "
          >
            <i class="fa-solid fa-arrow-right-from-bracket"></i> تسجيل الدخول
          </a>
        </div>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
      // Public page, like the one that sends the code: a visitor has no session
      // here by definition.
      const form = document.getElementById('verify-form');
      const btn = document.getElementById('submit-btn');
      const codeEl = document.getElementById('otp-code');

      // The address is a query parameter rather than a hidden form field so the
      // page can be reloaded, bookmarked and shared to the same browser without
      // losing it. It is displayed, never trusted: the code is matched against
      // whatever row was issued for it on the server.
      const email = new URLSearchParams(window.location.search).get('email') || '';

      // No address means no code was ever sent to this page — arriving directly,
      // or through a stale bookmark. Send them back rather than letting them
      // type a code that cannot be checked against anything.
      if (!email) {
        window.location.replace('/forgot-password.html');
      } else {
        document.getElementById('otp-email-label').textContent = email;
        document.getElementById('resend-link').href =
          '/forgot-password.html?email=' + encodeURIComponent(email);
        codeEl.focus();
      }

      // Digits only, capped at six. A pasted " 123456 " or an autofilled string
      // with spaces would otherwise be rejected by the server for a reason the
      // user cannot see.
      codeEl.addEventListener('input', function () {
        codeEl.value = codeEl.value.replace(/\D/g, '').slice(0, 6);
      });

      /**
       * Where a signed-in user goes next. Mirrors login.html so both ways of
       * obtaining a session land on the same page: Auth.homePath() resolves
       * customer -> /customer/home.html, technician -> /technician/dashboard.html
       * and admin -> /admin/dashboard.
       */
      function destinationAfterAuth(data) {
        const user = data.user || {};
        // A password an admin reset has still never been chosen by its owner.
        if (data.must_change_password) return '/change-password';
        // A Google-created customer has no phone yet: they hold a valid token
        // but the API refuses every customer route until they claim one.
        if (user.role === 'customer' && user.profile_complete === false) {
          return Auth.completeProfilePath();
        }
        return Auth.homePath(user.role);
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearFormErrors(document);

        const otp = codeEl.value.trim();
        if (!otp) {
          setFieldError(codeEl, 'اكتب الكود اللي بعثناهالك');
          return;
        }

        Ui.btnLoading(btn, 'جارٍ الدخول…');
        try {
          const data = await api('/api/auth/verify-otp', {
            method: 'POST',
            body: { email, otp },
          });
          Auth.setSession(data);
          toast('تم تسجيل الدخول بنجاح', 'success');
          setTimeout(function () {
            window.location.href = destinationAfterAuth(data);
          }, 600);
        } catch (err) {
          toast(err.message, 'error');
          Ui.btnReset(btn);
          // Cleared, not left in place: a rejected code is a code the user got
          // wrong or mistyped, and keeping six wrong digits under the cursor
          // invites the next attempt to be the same six digits again.
          codeEl.value = '';
          codeEl.focus();
        }
      });
    </script>
    <script src="/js/pwa-install.js"></script>
  </body>
</html>
