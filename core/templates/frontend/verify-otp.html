<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="/dashawy-brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/dashawy-brand/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/dashawy-brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>الخدمة غير متاحة — دشاوي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body
    style="
      background: linear-gradient(160deg, #f8fafc 0%, #eef2ff 100%);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: 'Cairo', sans-serif;
    "
  >
    <main style="max-width: 520px; width: 100%; text-align: center">
      <div
        style="
          display: inline-grid;
          place-items: center;
          width: 72px;
          height: 72px;
          border-radius: 20px;
          background: linear-gradient(135deg, #4f46e5, #a855f7);
          color: #fff;
          font-size: 1.8rem;
          box-shadow: 0 16px 40px -10px rgba(79, 70, 229, 0.5);
          margin-bottom: 18px;
        "
      >
        <i class="fa-solid fa-toolbox" aria-hidden="true"></i>
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 10px">
        الخدمة غير متاحة حالياً
      </h1>
      <p style="color: #64748b; font-size: 0.95rem; line-height: 1.8; margin-bottom: 24px">
        استرجاع كلمة المرور بالكود متوقف مؤقتاً. لو محتاج ترجّع حسابك، كلّمنا على واتساب
        وهنساعدك.
      </p>
      <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap">
        {% if business_whatsapp_url %}
        <a class="btn btn-brand" href="{{ business_whatsapp_url }}" target="_blank" rel="noopener">
          <i class="fa-brands fa-whatsapp" aria-hidden="true"></i> كلمنا على واتساب
        </a>
        {% endif %}
        <a class="btn btn-outline" href="/login.html">
          <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> رجوع لتسجيل الدخول
        </a>
      </div>
    </main>
  </body>
</html>
