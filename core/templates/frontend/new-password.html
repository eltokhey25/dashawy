<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/dashawy-brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/dashawy-brand/favicon.ico" sizes="any" />
    <link rel="icon" href="/dashawy-brand/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/dashawy-brand/apple-touch-icon.png" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>كلمة السر الجديدة — دشاوي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body
    style="
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--bg);
      font-family: 'Cairo', sans-serif;
    "
  >
    <main style="max-width: 480px; width: 100%">
      <div class="np-head" style="text-align: center; margin-bottom: 24px">
        <div
          style="
            display: inline-grid;
            place-items: center;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--brand);
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 16px;
          "
        >
          <i class="fa-solid fa-check" aria-hidden="true"></i>
        </div>
        <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--ink); letter-spacing: -0.01em; margin-bottom: 8px">
          اختار كلمة سر جديدة
        </h1>
        <p style="color: var(--ink-700); font-size: 0.95rem; font-weight: 600; line-height: 1.7">
          الكود اتأكد. اكتب كلمة السر الجديدة وهندخّلك على حسابك على طول.
        </p>
      </div>

      <div class="card np-card" style="padding: 26px">
        <form id="np-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="new-password">كلمة السر الجديدة</label>
            <input
              type="password"
              id="new-password"
              class="input"
              placeholder="8 حروف على الأقل، فيها حرف ورقم"
              autocomplete="new-password"
              dir="ltr"
            />
            <label class="order-show-password">
              <input type="checkbox" id="show-password" /> إظهار كلمة السر
            </label>
          </div>

          <button type="submit" class="btn btn-brand btn-block btn-lg" id="np-submit">
            <i class="fa-solid fa-key" aria-hidden="true"></i> تغيير كلمة السر والدخول
          </button>
        </form>

        <div
          style="
            display: flex;
            justify-content: center;
            gap: 12px 18px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
          "
        >
          <a href="/login.html" style="color: #94a3b8; font-size: 0.85rem; font-weight: 700; text-decoration: none">
            <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i> تسجيل الدخول
          </a>
        </div>
      </div>
    </main>

    <style>
      .np-head,
      .np-card {
        animation: authRise 420ms var(--ease-out) both;
      }
      .np-card {
        animation-delay: 80ms;
      }
      @media (prefers-reduced-motion: reduce) {
        .np-head,
        .np-card {
          animation: none;
        }
      }
    </style>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script nonce="{{ csp_nonce }}">
      // Second half of the password reset. /verify-otp leaves the confirmed
      // code here (this tab only) and sends the visitor over; without a fresh
      // one there is nothing to reset with, so back to asking for a code.
      const RESET_KEY = 'dashawy-otp-reset';
      const CODE_LIFETIME_MS = 10 * 60 * 1000;
      const form = document.getElementById('np-form');
      const btn = document.getElementById('np-submit');
      const passEl = document.getElementById('new-password');

      function readReset() {
        try {
          const saved = JSON.parse(sessionStorage.getItem(RESET_KEY) || 'null');
          if (saved && saved.identifier && /^\d{6}$/.test(saved.otp) && Date.now() - saved.at < CODE_LIFETIME_MS) {
            return saved;
          }
        } catch (e) {
          // Unreadable storage counts as no code.
        }
        return null;
      }

      function dropReset() {
        try {
          sessionStorage.removeItem(RESET_KEY);
        } catch (e) {
          // Nothing to clean up.
        }
      }

      function backToCode(identifier, expired) {
        const query = new URLSearchParams();
        if (identifier) query.set('identifier', identifier);
        if (expired) query.set('expired', '1');
        const suffix = query.toString();
        window.location.replace('/verify-otp' + (suffix ? '?' + suffix : ''));
      }

      const reset = readReset();
      if (!reset) {
        dropReset();
        backToCode('', true);
      } else {
        passEl.focus();
      }

      document.getElementById('show-password').addEventListener('change', (e) => {
        passEl.type = e.target.checked ? 'text' : 'password';
      });

      function destinationAfterAuth(data) {
        const user = data.user || {};
        if (user.role === 'customer' && user.profile_complete === false) return Auth.completeProfilePath();
        return Auth.homePath(user.role);
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!reset) return;
        clearFormErrors(form);
        const password = passEl.value;
        if (password.length < 8 || !/[a-zA-Z]/.test(password) || !/\d/.test(password)) {
          setFieldError(passEl, 'كلمة السر 8 حروف على الأقل، فيها حرف إنجليزي ورقم');
          passEl.focus();
          return;
        }
        Ui.btnLoading(btn, 'جارٍ التغيير…');
        try {
          const data = await api('/api/auth/reset-password', {
            method: 'POST',
            body: { identifier: reset.identifier, otp: reset.otp, new_password: password },
          });
          dropReset();
          Auth.setSession(data);
          toast('تم تغيير كلمة السر وتسجيل دخولك', 'success');
          setTimeout(() => {
            window.location.href = destinationAfterAuth(data);
          }, 600);
        } catch (err) {
          Ui.btnReset(btn);
          // The code ran out or was used meanwhile: a new one is needed.
          if (/الكود/.test(err.message || '')) {
            dropReset();
            backToCode(reset.identifier, true);
            return;
          }
          if (/كلمة/.test(err.message || '')) setFieldError(passEl, err.message);
          else toast(err.message, 'error');
        }
      });
    </script>
    <script src="/js/pwa-install.js"></script>
  </body>
</html>
