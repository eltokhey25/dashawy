<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="/dashawy-brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/dashawy-brand/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/dashawy-brand/apple-touch-icon.png">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>لا يوجد اتصال — دشاوي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(160deg, #0f172a, #1e293b);
      color: #e2e8f0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .box {
      max-width: 400px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 40px 30px;
    }
    .box i { font-size: 3rem; color: #6366f1; margin-bottom: 20px; display: block; }
    h1 { font-size: 1.4rem; margin-bottom: 12px; }
    p { color: #94a3b8; margin-bottom: 24px; line-height: 1.7; }
    button {
      background: #4f46e5;
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <div class="box">
    <i class="fa-solid fa-wifi"></i>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تأكد من اتصالك بالشبكة وحاول مرة أخرى.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
