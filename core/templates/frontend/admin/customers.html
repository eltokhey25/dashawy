<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="/dashawy-brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/dashawy-brand/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/dashawy-brand/apple-touch-icon.png">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>العملاء — دشاوي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/admin/_admin.css">
</head>
<body class="adm-body">
  <div class="adm-shell">
    <aside class="adm-sidebar" id="sidebar">
      <div class="adm-sidebar-brand">
        <img class="asb-logo" src="/dashawy-brand/logo-icon.svg" alt="دشاوي">
        <div class="asb-info">
          <b>دشاوي</b>
          <span>لوحة إدارة المنصة</span>
        </div>
      </div>

      <nav class="adm-sidebar-nav">
        <div class="adm-nav-section">عام</div>
        <a class="adm-nav-item" id="nav-stats" href="/admin/dashboard"><i class="fa-solid fa-gauge-high"></i> الإحصائيات</a>
        <a class="adm-nav-item" id="nav-requests" href="/admin/requests"><i class="fa-solid fa-list-check"></i> الطلبات<span class="badge" id="side-pending-count" style="margin-inline-start:auto;font-size:0.68rem;padding:2px 8px;border-radius:10px">0</span></a>
        <a class="adm-nav-item" id="nav-technicians" href="/admin/technicians"><i class="fa-solid fa-users-gear"></i> الفنيون</a>

        <div class="adm-nav-section">المالية</div>
        <a class="adm-nav-item" id="nav-finance" href="/admin/finance"><i class="fa-solid fa-file-invoice-dollar"></i> المالية<span class="badge" id="nav-finance-count" style="margin-inline-start:auto;font-size:0.68rem;padding:2px 8px;border-radius:10px;display:none">0</span></a>
        <a class="adm-nav-item" id="nav-wallets" href="/admin/wallets"><i class="fa-solid fa-wallet"></i> المحافظ</a>

        <div class="adm-nav-section">المحتوى</div>
        <a class="adm-nav-item" id="nav-reviews" href="/admin/reviews"><i class="fa-solid fa-star"></i> المراجعات</a>
        <a class="adm-nav-item active" id="nav-customers" href="/admin/customers"><i class="fa-solid fa-people-group"></i> العملاء</a>
        <a class="adm-nav-item" id="nav-specialties" href="/admin/specialties"><i class="fa-solid fa-tags"></i> التخصصات</a>

        <div class="adm-nav-section">النظام</div>
        <a class="adm-nav-item" id="nav-data-requests" href="/admin/data-requests"><i class="fa-solid fa-scale-balanced"></i> طلبات البيانات</a>
        <a class="adm-nav-item" id="nav-settings" href="/admin/settings"><i class="fa-solid fa-gear"></i> الإعدادات</a>
        <a class="adm-nav-item" href="/admin/admins" id="nav-admins" style="display:none;">
          <i class="fa-solid fa-user-shield"></i> المسؤولون
        </a>
      </nav>

      <div class="adm-sidebar-user">
        <span class="asu-avatar" id="side-avatar">إ</span>
        <div class="asu-info">
          <b id="side-name">مدير</b>
          <span>إدارة النظام</span>
        </div>
        <a class="btn btn-soft btn-sm" href="/change-password.html" title="تغيير كلمة المرور">
          <i class="fa-solid fa-key"></i>
        </a>
        <button class="btn btn-soft-danger btn-sm" onclick="Auth.logout('/admin')" title="تسجيل الخروج"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
    </aside>
    <div class="adm-backdrop" id="sidebar-backdrop"></div>

    <div class="adm-main">
      <header class="adm-topbar">
        <button class="adm-mobile-toggle" id="sidebar-toggle" aria-label="القائمة"><i class="fa-solid fa-bars"></i></button>
        <div class="atb-title" id="tb-title">العملاء</div>
        <div class="atb-spacer"></div>
        <button class="atb-btn" id="refresh-btn" title="تحديث"><i class="fa-solid fa-rotate"></i></button>
        <a class="atb-btn" href="/" target="_blank" title="الموقع"><i class="fa-solid fa-globe"></i></a>
      </header>

      <main class="adm-content">
        <div class="page-head">
          <div>
            <h1>العملاء</h1>
            <div class="sub">قائمة عملاء المنصة المسجلين</div>
          </div>
        </div>

        <div class="toolbar">
          <div class="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="search" class="input" placeholder="ابحث بالاسم أو الهاتف أو الإيميل…">
          </div>
          <button class="adm-btn" id="reset-filters"><i class="fa-solid fa-filter-circle-xmark"></i> مسح</button>
        </div>

        <div class="row-between" style="margin:16px 2px 10px">
          <span class="muted">إجمالي العملاء: <b id="total-count" style="color:var(--adm-ink)">—</b></span>
          <span class="tbl-sub" id="page-info" style="text-align:left"></span>
        </div>

        <div class="adm-card">
          <div class="adm-table-wrap">
            <table class="adm-table">
              <thead>
                <tr><th>العميل</th><th>الهاتف</th><th>سجل منذ</th><th>آخر نشاط</th><th>عدد الطلبات</th><th>الحالة</th><th style="text-align:left">إجراء</th></tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <div class="pager" id="pager"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/admin.js"></script>
  <script>
    (async () => {
      if (!(await Admin.init())) throw new Error('redirect');

      Admin.hideUnauthorizedNav();
      const me = Auth.getUser();
      if (me && me.is_super_admin) {
        const el = document.getElementById('nav-admins');
        if (el) el.style.display = '';
      }
      const user = Auth.getUser();
      document.getElementById('side-name').textContent = user.email;
      document.getElementById('side-avatar').textContent = Ui.initials('الإدارة');
      document.getElementById('tb-title').textContent = 'العملاء';

      const sidebar = document.getElementById('sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      const sbtn = document.getElementById('sidebar-toggle');
      backdrop.addEventListener('click', () => { sidebar.classList.remove('open'); backdrop.classList.remove('show'); });
      sbtn.addEventListener('click', () => { sidebar.classList.add('open'); backdrop.classList.add('show'); });
      const mq = window.matchMedia('(max-width:1024px)');
      mq.addEventListener('change', (e) => { sbtn.style.display = e.matches ? '' : 'none'; });
      sbtn.style.display = mq.matches ? '' : 'none';

      let all = [];
      let page = 1;
      const SIZE = 8;
      const searchEl = document.getElementById('search');
      let allRequests = [];

      function filtered() {
        const q = searchEl.value.trim().toLowerCase();
        return all.filter((c) => !q || (c.name + ' ' + c.phone + ' ' + (c.account_phone || '') + ' ' + c.email).toLowerCase().includes(q));
      }

      function reqCount(id) {
        return allRequests.filter((r) => r.customer_id === id).length;
      }
      function lastActivity(id) {
        const mine = allRequests.filter((r) => r.customer_id === id).sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
        return mine.length ? mine[0].created_at : null;
      }

      function render() {
        const rows = filtered();
        document.getElementById('total-count').textContent = rows.length;
        const pages = Math.max(1, Math.ceil(rows.length / SIZE));
        if (page > pages) page = pages;
        const start = (page - 1) * SIZE;
        const slice = rows.slice(start, start + SIZE);
        document.getElementById('page-info').textContent = (rows.length ? start + 1 : 0) + '–' + (start + slice.length) + ' من ' + rows.length;

        const tbody = document.getElementById('tbody');
        Ui.clear(tbody);
        if (!rows.length) {
          tbody.appendChild(Ui.el('tr', {}, [Ui.el('td', { attrs: { colspan: 7 } }, ['لا يوجد عملاء مطابقون'])]));
          Ui.clear(document.getElementById('pager'));
          return;
        }
        slice.forEach((c) => {
          const last = lastActivity(c.id);
          tbody.appendChild(Ui.el('tr', {}, [
            Ui.el('td', {}, [Ui.el('div', { class: 'tbl-user' }, [Ui.el('span', { class: 'avatar' }, [Ui.initials(c.name)]), Ui.el('div', {}, [Ui.el('div', { class: 'tbl-main' }, [Ui.escapeHtml(c.name)]), Ui.el('div', { class: 'tbl-sub' }, [Ui.escapeHtml(c.email)])])])]),
            // c.phone is the profile copy; account_phone is users.phone, the
            // login identity. They agree for everyone except a legacy account
            // whose number was already claimed by another profile.
            Ui.el('td', {}, [(c.phone || c.account_phone) ? Ui.el('span', { dir: 'ltr' }, [c.phone || c.account_phone]) : Ui.el('span', { class: 'muted' }, ['—'])]),
            Ui.el('td', {}, [Ui.dateTime(c.created_at)]),
            Ui.el('td', {}, [last ? Ui.dateTime(last) : Ui.el('span', { class: 'muted' }, ['—'])]),
            Ui.el('td', {}, [Ui.el('span', { class: 'badge b-assigned' }, [reqCount(c.id) + ' طلب'])]),
            Ui.el('td', {}, [c.blocked ? Ui.el('span', { class: 'badge b-cancelled' }, ['موقوف']) : Ui.el('span', { class: 'badge b-completed' }, ['نشط'])]),
            Ui.el('td', {}, [Ui.el('div', { style: 'display:flex;gap:6px;justify-content:flex-start', dir: 'ltr' }, [
              Ui.el('button', { class: 'btn btn-ghost btn-sm', attrs: { 'data-view': c.id } }, [Ui.ic('fa-regular fa-eye'), 'طلباته']),
              Ui.el('button', {
                class: 'btn btn-icon btn-soft',
                attrs: { 'data-reset-pwd': c.user_id, title: 'إعادة تعيين كلمة المرور' }
              }, [Ui.ic('fa-solid fa-key')])
            ])])
          ]));
        });
        Ui.paginate(document.getElementById('pager'), rows.length, page, SIZE, (p) => { page = p; render(); });
      }

      async function load() {
        const tbody = document.getElementById('tbody');
        Ui.clear(tbody);
        tbody.appendChild(Ui.skeletonTable(6, 6));
        try {
          const [cData, rData] = await Promise.all([api('/api/admin/customers'), api('/api/admin/requests')]);
          all = cData.customers || [];
          allRequests = rData.requests || [];
          render();
        } catch (e) { toast(e.message, 'error'); }
      }

      searchEl.addEventListener('input', () => { page = 1; render(); });
      document.getElementById('reset-filters').addEventListener('click', () => { searchEl.value = ''; page = 1; render(); });
      document.getElementById('refresh-btn').addEventListener('click', load);

      document.getElementById('tbody').addEventListener('click', async (e) => {
        const btn = e.target.closest('[data-view]');
        if (!btn) return;
        const id = Number(btn.dataset.view);
        Ui.btnLoading(btn, '');
        try {
          const data = await api('/api/admin/customers/' + id);
          Ui.btnReset(btn);
          openCustomerDetail(data);
        } catch (err) {
          Ui.btnReset(btn);
          toast(err.message, 'error');
        }
      });

      document.getElementById('tbody').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-reset-pwd]');
        if (!btn) return;
        const userId = Number(btn.dataset.resetPwd);
        const cust = all.find((x) => x.user_id === userId);
        if (!cust) return;
        openResetPasswordModal({ displayName: cust.name, userId });
      });

      // The server generates the temporary password; the admin sees it once and
      // must hand it to the account owner. Nothing is typed here.
      function openResetPasswordModal({ displayName, userId }) {
        const body = Ui.el('div', {}, [
          Ui.el('p', { style: 'color:var(--muted);font-size:0.87rem;margin-bottom:16px;line-height:1.7' }, [
            'إعادة تعيين كلمة المرور لـ ',
            Ui.el('b', { style: 'color:var(--ink)' }, [displayName]),
            '. هننشئ كلمة مرور مؤقتة ونعرضها لك مرة واحدة.'
          ]),
          Ui.el('div', { class: 'form-hint' }, [
            Ui.ic('fa-solid fa-shield-halved'),
            ' سيُطلب من المستخدم تغييرها عند أول دخول، وأي جلسة قديمة هتتوقف فورًا.'
          ])
        ]);

        const saveBtn = Ui.el('button', {
          class: 'btn btn-brand',
          on: { click: async () => {
            Ui.btnLoading(saveBtn, 'جارٍ الإنشاء…');
            try {
              const d = await api('/api/admin/users/' + userId + '/reset-password', { method: 'POST' });
              showTemporaryPassword(displayName, d.temporary_password || d.temp_password);
            } catch (err) {
              toast(err.message, 'error');
              Ui.btnReset(saveBtn);
            }
          }}
        }, [Ui.ic('fa-solid fa-key'), 'إنشاء كلمة مرور مؤقتة']);

        Ui.openModal(
          { title: 'إعادة تعيين كلمة المرور', icon: { cls: 'fa-solid fa-key', bg: '#fef3c7', color: '#b45309' } },
          body,
          saveBtn
        );
      }

      function showTemporaryPassword(displayName, password) {
        const copyBtn = Ui.el('button', {
          class: 'btn btn-outline',
          on: { click: async () => {
            try {
              await navigator.clipboard.writeText(password);
              toast('تم نسخ كلمة المرور للحافظة', 'success');
            } catch (err) {
              toast('تعذر النسخ التلقائي، انسخها يدويًا', 'error');
            }
          }}
        }, [Ui.ic('fa-regular fa-copy'), 'نسخ']);

        const doneBtn = Ui.el('button', {
          class: 'btn btn-brand',
          on: { click: () => Ui.openModal(null, null, null) }
        }, ['تم']);

        const body = Ui.el('div', {}, [
          Ui.el('p', { style: 'color:var(--muted);font-size:0.87rem;line-height:1.7;margin-bottom:12px' }, [
            'كلمة المرور المؤقتة لـ ',
            Ui.el('b', { style: 'color:var(--ink)' }, [displayName]),
            '. اعرضها للمستخدم الآن — مش هتظهر تاني.'
          ]),
          Ui.el('div', {
            attrs: {
              dir: 'ltr',
              style: 'font-family:monospace;font-size:1.15rem;font-weight:700;letter-spacing:0.05em;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:10px;padding:14px;text-align:center;word-break:break-all'
            },
            text: password
          })
        ]);

        Ui.openModal(
          { title: 'كلمة المرور المؤقتة', icon: { cls: 'fa-solid fa-key', bg: '#dcfce7', color: '#15803d' } },
          body,
          [copyBtn, doneBtn]
        );
      }

      function openCustomerDetail(data) {
        const c = data.customer;
        const s = data.stats;

        const body = Ui.el('div', {});

        // Header
        body.appendChild(Ui.el('div', { style: 'display:flex;align-items:center;gap:14px;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--line)' }, [
          Ui.el('span', { class: 'avatar', style: 'width:56px;height:56px;font-size:1.1rem' }, [Ui.initials(c.name)]),
          Ui.el('div', { style: 'flex:1' }, [
            Ui.el('div', { style: 'font-weight:800;font-size:1.05rem;color:var(--ink)' }, [Ui.escapeHtml(c.name)]),
            Ui.el('div', { class: 'tbl-sub' }, [Ui.escapeHtml(c.email || '')])
          ]),
          c.blocked ? Ui.el('span', { class: 'badge b-cancelled' }, ['موقوف'])
                    : Ui.el('span', { class: 'badge b-completed' }, ['نشط'])
        ]));

        // Info
        const info = Ui.el('div', { class: 'detail-grid', style: 'margin-bottom:18px' });
        const row = (k, v) => info.appendChild(Ui.el('div', { class: 'detail-row' }, [
          Ui.el('span', { class: 'dk' }, [k]),
          Ui.el('span', { class: 'dv' }, [v])
        ]));
        row('الهاتف', c.phone ? Ui.el('a', { attrs: { href: 'tel:' + c.phone, dir: 'ltr' } }, [c.phone]) : '—');
        row('العنوان', Ui.escapeHtml(c.location_text || '—'));
        row('تاريخ التسجيل', Ui.dateTime(c.created_at || c.account_created_at));
        body.appendChild(info);

        // Stats
        body.appendChild(Ui.el('h3', { style: 'margin:18px 0 12px;font-size:0.95rem;font-weight:800;color:var(--ink)' }, ['الإحصائيات']));
        const stats = Ui.el('div', { style: 'display:grid;grid-template-columns:repeat(4,1fr);gap:10px' });
        const statBox = (v, l, color) => Ui.el('div', { style: 'background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center' }, [
          Ui.el('b', { style: 'display:block;font-size:1.5rem;color:' + (color || 'var(--ink)') + ';font-weight:900;line-height:1.1' }, [String(v)]),
          Ui.el('span', { style: 'font-size:0.75rem;color:var(--muted);font-weight:600' }, [l])
        ]);
        stats.appendChild(statBox(s.total, 'إجمالي الطلبات'));
        stats.appendChild(statBox(s.completed, 'مكتملة', '#10b981'));
        stats.appendChild(statBox(s.active, 'نشطة', '#0ea5e9'));
        stats.appendChild(statBox(s.cancelled, 'ملغاة', '#ef4444'));
        body.appendChild(stats);

        // Recent requests
        if (data.recentRequests && data.recentRequests.length) {
          body.appendChild(Ui.el('h3', { style: 'margin:20px 0 12px;font-size:0.95rem;font-weight:800;color:var(--ink)' }, ['آخر 10 طلبات']));
          const list = Ui.el('div', { style: 'display:grid;gap:8px' });
          data.recentRequests.forEach((r) => {
            const m = Ui.meta(r.specialty);
            list.appendChild(Ui.el('div', { style: 'display:flex;align-items:center;gap:10px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:0.83rem' }, [
              Ui.el('span', { style: 'font-weight:700' }, ['#' + r.id]),
              Ui.el('span', { class: 'badge', attrs: { style: 'background:' + m.bg + ';color:' + m.color } }, [Ui.ic(m.icon), m.label]),
              Ui.el('span', { style: 'flex:1;color:var(--muted)' }, [r.technician_name ? 'الفني: ' + Ui.escapeHtml(r.technician_name) : 'بدون فني']),
              Ui.statusBadge(r.status),
              Ui.el('span', { class: 'tbl-sub' }, [Ui.dateTime(r.created_at)])
            ]));
          });
          body.appendChild(list);
        }

        // Footer actions
        const footer = Ui.el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start;width:100%' });

        footer.appendChild(Ui.el('button', {
          class: 'btn btn-outline btn-sm',
          on: { click: async () => {
            try {
              const r = await api('/api/admin/customers/' + c.id + '/block', { method: 'PATCH', body: { blocked: !c.blocked } });
              toast(r.message, 'success');
              Ui.openModal(null, null, null, { onClose: null });
              load();
            } catch (err) { toast(err.message, 'error'); }
          }}
        }, [Ui.ic(c.blocked ? 'fa-solid fa-circle-play' : 'fa-solid fa-circle-pause'), c.blocked ? 'تفعيل الحساب' : 'إيقاف الحساب']));

        footer.appendChild(Ui.el('button', {
          class: 'btn btn-soft-danger btn-sm',
          on: { click: async () => {
            if (!confirm('حذف العميل «' + c.name + '» نهائياً؟ سيتم حذف كل طلباته وحسابه.')) return;
            if (!confirm('تأكيد أخير: هل أنت متأكد تماماً؟ لا يمكن التراجع.')) return;
            try {
              const r = await api('/api/admin/customers/' + c.id, { method: 'DELETE' });
              toast(r.message, 'success');
              Ui.openModal(null, null, null, { onClose: null });
              load();
            } catch (err) { toast(err.message, 'error'); }
          }}
        }, [Ui.ic('fa-solid fa-trash'), 'حذف العميل']));

        footer.appendChild(Ui.el('button', {
          class: 'btn btn-soft',
          on: { click: () => Ui.openModal(null, null, null, { onClose: null }) }
        }, ['إغلاق']));

        Ui.openModal(
          { title: 'ملف العميل', icon: { cls: 'fa-solid fa-user', bg: '#eef2ff', color: '#4f46e5' } },
          body, footer, { lg: true }
        );
      }

      window.closeModal = () => Ui.openModal(null, null, null, { onClose: null });

      load();
    })();
  </script>
</body>
</html>
