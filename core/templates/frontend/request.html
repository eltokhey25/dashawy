<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="/dashawy-brand/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/dashawy-brand/favicon.ico" sizes="any">
    <link rel="icon" href="/dashawy-brand/icon-192.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="/dashawy-brand/apple-touch-icon.png">
    <meta name="theme-color" content="#4f46e5">
    <link rel="manifest" href="/manifest.webmanifest">
    <title>اطلب الخدمة — دشاوي</title>
    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="دشاوي" />
    <!-- iOS splash screen (universal fallback) -->
    <link rel="apple-touch-startup-image" href="/dashawy-brand/icon-512.png" />
    <meta
      name="description"
      content="اطلب فني دش معتمد في الإسكندرية — أربع خطوات ويوصلك أقرب فني."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="uber-app">
      <header class="uber-topbar">
        <a class="uber-brand" href="/customer/home.html">
          <img class="brand-logo-image" src="/dashawy-brand/logo-horizontal.svg" alt="دشاوي">
        </a>
        <div class="uber-topbar-actions">
          <a href="/customer/my-requests.html" class="ub-icon-btn" title="طلباتي">
            <i class="fa-solid fa-list-check"></i>
          </a>
          <button class="ub-icon-btn" id="ub-logout" title="خروج" type="button">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
          </button>
        </div>
      </header>

      <main class="uber-main" id="uber-main"></main>

      <footer class="uber-sheet hidden" id="uber-sheet"></footer>

      <div class="uber-queued" id="uber-queued" style="display: none"></div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script nonce="{{ csp_nonce }}">
      (async () => {
        if (!Auth.requireRole('customer')) return;

        const main = document.getElementById('uber-main');
        const sheet = document.getElementById('uber-sheet');
        const receivedEl = document.getElementById('uber-queued');

        const state = {
          step: 'service',
          service: null,
          customText: '',
          area_key: null,
          location_text: '',
          description: '',
          latitude: null,
          longitude: null,
          requestId: null,
        };

        const STEPS = ['service', 'location', 'details', 'confirm'];

        // Where each step's back button goes. 'service' is the floor, so it has no
        // back affordance at all.
        const BACK_TARGET = { location: 'service', details: 'location', confirm: 'details' };

        const STEP_TITLES = {
          service: ['إيه اللي محتاج مساعدة فيه؟', 'اختر الخدمة وهنوصلك أقرب فني ليها'],
          location: ['فين المكان؟', 'اختر منطقتك بالظبط عشان نوصلك أسرع فني'],
          details: ['وصف المشكلة', 'اكتب تفاصيل بسيطة — الفني هيعرف يتصرف'],
          confirm: ['تأكيد الطلب', 'راجع البيانات قبل ما تبعتها'],
        };

        let specialties = [];
        let areas = [];

        // ------------------------------------------------------------
        // Reference data
        // ------------------------------------------------------------
        async function loadData() {
          try {
            const [specRes, areaRes] = await Promise.all([
              api('/api/specialties'),
              api('/api/alexandria-areas'),
            ]);
            specialties = specRes.specialties || [];
            areas = areaRes.areas || [];
          } catch (e) {
            // Nothing can be rendered without these, so say so plainly instead of
            // showing an empty grid the customer cannot act on.
            Ui.clear(main);
            main.appendChild(
              Ui.el('div', { class: 'ua-info-card' }, [
                Ui.ic('fa-solid fa-triangle-exclamation'),
                ' تعذر تحميل الخدمات. تأكد من الإنترنت وجرب تاني.',
              ])
            );
          }
        }

        // The API's label/icon are admin-editable, so they win where present. The
        // description and colour live only in the shared Ui.meta map, which is
        // also what the rest of the site renders from — so both sources are used
        // rather than picking one and losing half the card.
        function cardMeta(s) {
          const m = Ui.meta(s.key);
          const known = m.label !== s.key; // Ui.meta echoes the key when unknown
          return {
            label: s.label || m.label,
            desc: m.desc || '',
            icon: known ? m.icon : s.icon || m.icon,
            color: m.color,
            bg: m.bg,
          };
        }

        function areaLabel(key) {
          const found = areas.find((a) => a.key === key);
          return found ? found.label : '';
        }

        function selectedServiceLabel() {
          // For 'other' the service NAME is the custom text, so that is what the
          // summary shows — echoing the generic "أخرى" would not tell the
          // customer what they are about to book.
          if (state.service === 'other' && state.customText.trim()) {
            return state.customText.trim();
          }
          const row = specialties.find((s) => s.key === state.service);
          return row ? cardMeta(row).label : Ui.meta(state.service).label;
        }

        // ------------------------------------------------------------
        // Step 1 — service
        // ------------------------------------------------------------
        function renderService() {
          const frag = document.createDocumentFragment();
          const [title, sub] = STEP_TITLES.service;
          frag.appendChild(Ui.el('h1', { class: 'uber-step-title' }, [title]));
          frag.appendChild(Ui.el('p', { class: 'uber-step-sub' }, [sub]));

          const grid = Ui.el('div', { class: 'uber-service-grid' });
          specialties.forEach((s) => {
            const m = cardMeta(s);
            const card = Ui.el(
              'button',
              {
                class: 'uber-service-card' + (state.service === s.key ? ' selected' : ''),
                attrs: { type: 'button', 'data-service': s.key },
                on: {
                  click: () => {
                    state.service = s.key;
                    // The custom-text field belongs to the 'other' branch only, so
                    // its value is dropped when leaving it: carrying a stale
                    // "تنظيف هوائي" into a later dish_repair request would label
                    // the job wrong.
                    if (s.key !== 'other') {
                      state.customText = '';
                      go('location');
                      return;
                    }
                    // 'other' is the one card that cannot advance on its own — the
                    // server rejects the request unless the customer names the
                    // service — so it stays put and reveals the name field.
                    render();
                  },
                },
              },
              [
                Ui.el(
                  'span',
                  {
                    class: 'usc-icon',
                    attrs: { style: 'background:' + m.bg + ';color:' + m.color },
                  },
                  [Ui.ic(m.icon)]
                ),
                Ui.el('span', { class: 'usc-body' }, [
                  Ui.el('span', { class: 'usc-label' }, [m.label]),
                  Ui.el('span', { class: 'usc-desc' }, [m.desc]),
                ]),
                Ui.el('span', { class: 'usc-check' }, [Ui.ic('fa-solid fa-circle-check')]),
              ]
            );
            grid.appendChild(card);
          });
          frag.appendChild(grid);

          if (state.service === 'other') {
            const custom = Ui.el('input', {
              class: 'input ub-field',
              id: 'ub-custom',
              attrs: {
                type: 'text',
                maxlength: '200',
                placeholder: 'مثال: تركيب سبلاش كير',
                value: state.customText,
              },
            });
            custom.addEventListener('input', () => {
              state.customText = custom.value;
              renderSheet();
            });
            frag.appendChild(
              Ui.el('div', { class: 'form-group ub-custom' }, [
                Ui.el('label', { class: 'form-label', attrs: { for: 'ub-custom' } }, [
                  'اسم الخدمة المطلوبة ',
                  Ui.el('span', { class: 'ub-req' }, ['*']),
                ]),
                custom,
                Ui.el('div', { class: 'form-hint' }, [
                  'اكتب اسم الخدمة بالظبط عشان نوصلك الفني المناسب',
                ]),
              ])
            );
            frag.appendChild(
              Ui.el(
                'button',
                {
                  class: 'ub-edit',
                  attrs: { type: 'button' },
                  on: {
                    click: () => {
                      state.service = null;
                      state.customText = '';
                      render();
                    },
                  },
                },
                [Ui.ic('fa-solid fa-xmark'), ' اختيار خدمة من القائمة']
              )
            );
          }

          main.appendChild(frag);
        }

        // ------------------------------------------------------------
        // Step 2 — location
        // ------------------------------------------------------------
        function renderLocation() {
          const frag = document.createDocumentFragment();
          const [title, sub] = STEP_TITLES.location;
          frag.appendChild(Ui.el('h1', { class: 'uber-step-title' }, [title]));
          frag.appendChild(Ui.el('p', { class: 'uber-step-sub' }, [sub]));

          const areaSelect = Ui.el('select', {
            class: 'input ub-field',
            attrs: { id: 'ub-area', 'aria-label': 'المنطقة' },
          });
          areaSelect.appendChild(Ui.el('option', { attrs: { value: '' } }, ['اختر منطقتك…']));
          areas.forEach((a) => {
            // Only the chosen area carries the `selected` attribute: setting it
            // on every option (which is what a null value would do through
            // Ui.el) makes the browser show the last area instead of the one the
            // customer actually picked.
            const attrs = { value: a.key };
            if (state.area_key === a.key) attrs.selected = '';
            areaSelect.appendChild(Ui.el('option', { attrs }, [a.label]));
          });
          areaSelect.addEventListener('change', () => {
            state.area_key = areaSelect.value;
            renderSheet();
          });
          frag.appendChild(
            Ui.el('div', { class: 'form-group' }, [
              Ui.el('label', { class: 'form-label', attrs: { for: 'ub-area' } }, [
                'المنطقة ',
                Ui.el('span', { class: 'ub-req' }, ['*']),
              ]),
              areaSelect,
            ])
          );

          const address = Ui.el('input', {
            class: 'input ub-field',
            id: 'ub-address',
            attrs: {
              type: 'text',
              maxlength: '300',
              placeholder: 'مثال: شارع فوزي معاذ، عمارة 12، الدور 3',
              value: state.location_text,
            },
          });
          address.addEventListener('input', () => {
            state.location_text = address.value;
          });
          frag.appendChild(
            Ui.el('div', { class: 'form-group', attrs: { style: 'margin-top:16px' } }, [
              Ui.el('label', { class: 'form-label', attrs: { for: 'ub-address' } }, [
                'العنوان بالتفصيل (اختياري)',
              ]),
              address,
            ])
          );

          const geoBtn = Ui.el(
            'button',
            { class: 'btn btn-outline ub-geo-btn', attrs: { type: 'button', id: 'ub-geo' } },
            [Ui.ic('fa-solid fa-location-crosshairs'), ' استخدم موقعي الحالي']
          );
          geoBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
              toast('المتصفح لا يدعم تحديد الموقع', 'warn');
              return;
            }
            Ui.btnLoading(geoBtn, 'جاري التحديد...');
            navigator.geolocation.getCurrentPosition(
              (pos) => {
                state.latitude = Number(pos.coords.latitude.toFixed(6));
                state.longitude = Number(pos.coords.longitude.toFixed(6));
                Ui.clear(geoBtn);
                geoBtn.appendChild(Ui.ic('fa-solid fa-location-crosshairs'));
                geoBtn.appendChild(document.createTextNode(' تم تحديد موقعك ✓'));
                geoBtn.disabled = true;
                toast('تم تحديد موقعك ✓', 'success');
              },
              () => {
                toast('تعذر تحديد الموقع — اكتب العنوان يدوي', 'error');
                Ui.btnReset(geoBtn);
              },
              { enableHighAccuracy: true, timeout: 10000 }
            );
          });
          frag.appendChild(Ui.el('div', { attrs: { style: 'margin-top:16px' } }, [geoBtn]));

          main.appendChild(frag);
        }

        // ------------------------------------------------------------
        // Step 3 — details
        // ------------------------------------------------------------
        function renderDetails() {
          const frag = document.createDocumentFragment();
          const [title, sub] = STEP_TITLES.details;
          frag.appendChild(Ui.el('h1', { class: 'uber-step-title' }, [title]));
          frag.appendChild(Ui.el('p', { class: 'uber-step-sub' }, [sub]));

          const ta = Ui.el('textarea', {
            class: 'input ub-field ub-textarea',
            id: 'ub-desc',
            attrs: {
              rows: '6',
              maxlength: '2000',
              placeholder: 'مثال: الدش بيفصل في القنوات لما الجو يبقى مش صافي',
            },
          });
          ta.value = state.description;
          ta.addEventListener('input', () => {
            state.description = ta.value;
            renderSheet();
          });
          frag.appendChild(ta);

          main.appendChild(frag);
        }

        // ------------------------------------------------------------
        // Step 4 — confirm
        // ------------------------------------------------------------
        function renderConfirm() {
          const frag = document.createDocumentFragment();
          const [title, sub] = STEP_TITLES.confirm;
          frag.appendChild(Ui.el('h1', { class: 'uber-step-title' }, [title]));
          frag.appendChild(Ui.el('p', { class: 'uber-step-sub' }, [sub]));

          const card = Ui.el('div', { class: 'ua-info-card' });
          const rows = [
            ['الخدمة', selectedServiceLabel()],
            ['المنطقة', areaLabel(state.area_key)],
          ];
          if (state.location_text.trim()) rows.push(['العنوان', state.location_text.trim()]);
          if (state.description.trim()) rows.push(['الوصف', state.description.trim()]);
          rows.forEach(([k, v]) => {
            card.appendChild(
              Ui.el('div', { class: 'ua-info-row' }, [
                Ui.el('span', {}, [k]),
                Ui.el('span', {}, [v]),
              ])
            );
          });
          frag.appendChild(card);

          // Edit links: the whole point of a one-screen-per-step flow is that a
          // wrong answer is one tap from fixed, not four steps back.
          const edits = Ui.el('div', { class: 'ub-edits' }, [
            Ui.el(
              'button',
              {
                class: 'ub-edit',
                attrs: { type: 'button' },
                on: {
                  click: () => {
                    state.step = 'location';
                    render();
                  },
                },
              },
              [Ui.ic('fa-solid fa-pen'), ' تعديل الموقع']
            ),
            Ui.el(
              'button',
              {
                class: 'ub-edit',
                attrs: { type: 'button' },
                on: {
                  click: () => {
                    state.step = 'details';
                    render();
                  },
                },
              },
              [Ui.ic('fa-solid fa-pen'), ' تعديل الوصف']
            ),
          ]);
          frag.appendChild(edits);

          frag.appendChild(
            Ui.el('div', { class: 'ua-info-card ub-notice' }, [
              Ui.ic('fa-solid fa-circle-info'),
              ' هيتपरسل طلبك لكل الفنيين المتاحين في منطقتك. أول فني يقبل، هيوصلك.',
            ])
          );

          // Cash is the only method and the amount is agreed after the job — say
          // so here rather than letting a customer assume a card was charged.
          frag.appendChild(
            Ui.el('div', { class: 'ua-info-card ub-notice' }, [
              Ui.ic('fa-solid fa-money-bill-wave'),
              ' الدفع نقداً للفني بعد ما يخلص الشغل، وتأكدّده أنت بإيراد المبلغ.',
            ])
          );

          main.appendChild(frag);
        }

        // ------------------------------------------------------------
        // Bottom sheet — one primary action per step, always reachable
        // ------------------------------------------------------------
        function sheetButton(label, opts) {
          opts = opts || {};
          // `disabled` is only ever added when it should be: Ui.el turns a null
          // attribute value into '', so passing disabled: null would still
          // render the button disabled.
          const attrs = { type: 'button' };
          if (opts.id) attrs.id = opts.id;
          if (opts.disabled) attrs.disabled = '';
          return Ui.el(
            'button',
            {
              class: 'btn ' + (opts.variant || 'btn-brand'),
              attrs,
              on: opts.on,
            },
            opts.icon ? [Ui.ic(opts.icon), ' ' + label] : [label]
          );
        }

        function renderSheet() {
          Ui.clear(sheet);
          sheet.classList.remove('hidden');

          const step = state.step;

          // 'service' needs no CTA: tapping a card IS the action. The one
          // exception is 'other', which the server rejects unless the customer
          // names the service — so that branch keeps a continue button.
          if (step === 'service' && state.service !== 'other') {
            sheet.classList.add('hidden');
            return;
          }

          if (step === 'confirm') {
            sheet.appendChild(
              sheetButton('إرسال الطلب', {
                id: 'ub-submit',
                icon: 'fa-solid fa-paper-plane',
                on: { click: submitRequest },
              })
            );
            return;
          }

          if (step !== 'service') {
            sheet.appendChild(
              sheetButton('السابق', {
                id: 'ub-back',
                variant: 'btn-outline',
                on: {
                  click: () => {
                    go(BACK_TARGET[step]);
                  },
                },
              })
            );
          }
          sheet.appendChild(
            sheetButton('متابعة', {
              id: 'ub-next',
              icon: 'fa-solid fa-arrow-left',
              disabled: !isStepValid(),
              on: {
                click: () => {
                  if (!isStepValid()) {
                    toast(
                      step === 'service'
                        ? 'اكتب اسم الخدمة المطلوبة'
                        : step === 'location'
                          ? 'اختر منطقتك الأول'
                          : 'اكتب وصف بسيط للمشكلة',
                      'error'
                    );
                    return;
                  }
                  go(STEPS[STEPS.indexOf(step) + 1]);
                },
              },
            })
          );
        }

        function isStepValid() {
          // 'other' additionally needs the service name the server demands.
          if (state.step === 'service') return state.customText.trim().length >= 3;
          if (state.step === 'location') return Boolean(state.area_key);
          if (state.step === 'details') return state.description.trim().length >= 5;
          return true;
        }

        // ------------------------------------------------------------
        // Navigation
        // ------------------------------------------------------------
        function go(step) {
          state.step = step;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function render() {
          Ui.clear(main);
          if (state.step === 'service') renderService();
          else if (state.step === 'location') renderLocation();
          else if (state.step === 'details') renderDetails();
          else if (state.step === 'confirm') renderConfirm();
          renderSheet();
        }

        // ------------------------------------------------------------
        // Submit + search
        // ------------------------------------------------------------
        async function submitRequest() {
          const btn = document.getElementById('ub-submit');
          if (!btn || btn.disabled) return;
          Ui.btnLoading(btn, 'جاري الإرسال...');

          try {
            const body = {
              specialty: state.service,
              description: state.description.trim(),
              area_key: state.area_key,
            };
            if (state.service === 'other') body.custom_specialty_text = state.customText.trim();
            if (state.location_text.trim()) body.location_text = state.location_text.trim();
            if (state.latitude !== null && state.longitude !== null) {
              body.latitude = state.latitude;
              body.longitude = state.longitude;
            }

            const data = await api('/api/customer/requests', { method: 'POST', body });
            state.requestId = data.request.id;
            rememberPending(data.request.id);

            showReceived();
          } catch (err) {
            toast(err.message, 'error');
            Ui.btnReset(btn);
          }
        }

        // ------------------------------------------------------------
        // Received: the order is with the technicians now
        // ------------------------------------------------------------
        // The request is offered to every eligible technician and the first to
        // accept gets it. There is nothing to wait for on this page: the
        // customer is told the order arrived, and My requests (which polls)
        // announces the technician's name when one accepts.
        // My requests announces "accepted — technician: X" by comparing with the
        // statuses it saw last; recording the new order as pending here means the
        // announcement also fires if the customer first opens it after the accept.
        function rememberPending(requestId) {
          try {
            const key = 'dashawy_seen_request_statuses';
            const seen = JSON.parse(localStorage.getItem(key) || '{}') || {};
            seen[requestId] = 'pending';
            localStorage.setItem(key, JSON.stringify(seen));
          } catch (e) {
            /* storage unavailable: the card still shows the technician's name */
          }
        }

        function showReceived() {
          sheet.classList.add('hidden');
          Ui.clear(main);
          receivedEl.style.display = 'flex';
          Ui.clear(receivedEl);

          receivedEl.appendChild(
            Ui.el('div', { class: 'uq-icon uq-icon-ok' }, [Ui.ic('fa-solid fa-circle-check')])
          );
          receivedEl.appendChild(
            Ui.el('h1', { class: 'uq-title' }, ['تم تلقي طلبك وسيتم التواصل معك'])
          );
          receivedEl.appendChild(
            Ui.el('p', { class: 'uq-sub' }, [
              'طلبك اتبعت للفنيين. أول ما فني يقبله هيظهرلك اسمه في «طلباتي» وهيتواصل معاك.',
            ])
          );
          receivedEl.appendChild(
            Ui.el('div', { class: 'uq-actions' }, [
              Ui.el(
                'a',
                { class: 'btn btn-brand', attrs: { href: '/customer/my-requests.html' } },
                ['متابعة الطلب']
              ),
              Ui.el(
                'button',
                {
                  class: 'btn btn-outline',
                  attrs: { type: 'button' },
                  on: { click: resetFlow },
                },
                [Ui.ic('fa-solid fa-rotate-right'), ' طلب جديد']
              ),
              Ui.el('a', { class: 'btn btn-ghost', attrs: { href: '/' } }, ['الرئيسية']),
            ])
          );
        }

        function resetFlow() {
          receivedEl.style.display = 'none';
          state.step = 'service';
          state.service = null;
          state.customText = '';
          state.area_key = null;
          state.location_text = '';
          state.description = '';
          state.latitude = null;
          state.longitude = null;
          state.requestId = null;
          render();
        }

        document.getElementById('ub-logout').addEventListener('click', () => Auth.logout());

        await loadData();
        render();

        // Deep link from a service card on the marketing site:
        // /request?service=dish_repair. The choice has already been made, so the
        // wizard opens on the location step with it preselected instead of
        // making the customer tap the same card again. An unknown or disabled
        // key is ignored and the normal list is shown — a stale link must not
        // submit a service the server will reject.
        const presetKey = new URLSearchParams(window.location.search).get('service');
        if (presetKey && specialties.some((s) => s.key === presetKey)) {
          state.service = presetKey;
          go('location');
        }
      })();
    </script>
    <script src="/js/pwa-install.js"></script>
    <script src="/js/push.js"></script>
  </body>
</html>
